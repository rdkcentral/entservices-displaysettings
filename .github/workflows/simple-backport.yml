name: Simple Branch Backport

on:
  push:
    branches:
      - feature/Github_POC   # keeps workflow visible in Actions sidebar
  workflow_dispatch:
    inputs:

      source_branch:
        description: "Feature branch with your changes (e.g. feature/Github_POC)"
        required: true
        type: string

      support_branch:
        description: "Release branch to apply changes into (e.g. support/8.3.4.0)"
        required: true
        type: string

      new_branch_name:
        description: "New branch name to create on top of support branch (e.g. feature/RDKEMW-21092)"
        required: true
        type: string

      specific_commits:
        description: "OPTIONAL: Comma-separated specific commit SHAs to apply (e.g. 9e4c2b6,a1b2c3d). Leave empty to apply ALL new commits from source branch."
        required: false
        type: string
        default: ""

      pr_title:
        description: "PR title (e.g. RDKEMW-21092: Fix log message in Request)"
        required: false
        type: string
        default: ""

      pr_body:
        description: "PR description / change summary"
        required: false
        type: string
        default: "Automated backport created by simple-backport workflow."

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RDKCM_RDKE }}

      - name: Configure Git
        run: |
          git config user.name  "GitHub Actions [Backport]"
          git config user.email "github-actions@users.noreply.github.com"

      # ── STEP 1: Check support branch exists ─────────────────────────────────
      - name: Check support branch exists
        env:
          SUPPORT: ${{ github.event.inputs.support_branch }}
        run: |
          echo "Checking if support branch '$SUPPORT' exists..."

          if ! git ls-remote --exit-code --heads origin "$SUPPORT" > /dev/null 2>&1; then
            echo ""
            echo "❌ Branch not found: '$SUPPORT'"
            echo "   Please check the branch name and try again."
            exit 1
          fi

          echo "✅ Branch '$SUPPORT' found."

      # ── STEP 2: Get commits from source branch ───────────────────────────────
      - name: Get commits to apply
        id: get_commits
        env:
          SOURCE:   ${{ github.event.inputs.source_branch }}
          SPECIFIC: ${{ github.event.inputs.specific_commits }}
        run: |
          # ── If user provided specific commit SHAs, use those directly ────────
          if [ -n "$SPECIFIC" ]; then
            echo "Using specific commits provided by user: $SPECIFIC"
            COUNT=$(echo "$SPECIFIC" | tr ',' '\n' | grep -c '.')
            echo "commits=$SPECIFIC" >> "$GITHUB_OUTPUT"
            echo "count=$COUNT"      >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Otherwise, auto-detect all new commits vs develop ─────────────────
          echo "Fetching source branch '$SOURCE'..."
          git fetch origin "$SOURCE"
          git fetch origin develop

          COMMITS=$(git log --reverse --pretty=format:"%H" "origin/develop..origin/$SOURCE")

          if [ -z "$COMMITS" ]; then
            echo "❌ No new commits found in '$SOURCE' compared to develop."
            exit 1
          fi

          COUNT=$(echo "$COMMITS" | wc -l)
          echo ""
          echo "Found $COUNT commit(s):"
          git log --oneline "origin/develop..origin/$SOURCE"

          echo "commits=$(echo "$COMMITS" | tr '\n' ',')" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # ── STEP 3: Create or checkout branch on top of support ─────────────────
      - name: Create or checkout branch on support
        id: create_branch
        env:
          SUPPORT:    ${{ github.event.inputs.support_branch }}
          NEW_BRANCH: ${{ github.event.inputs.new_branch_name }}
        run: |
          echo "Fetching '$SUPPORT'..."
          git fetch origin "$SUPPORT"

          if git ls-remote --exit-code --heads origin "$NEW_BRANCH" > /dev/null 2>&1; then
            echo "Branch '$NEW_BRANCH' already exists on remote — checking it out..."
            git fetch origin "$NEW_BRANCH"
            git checkout "$NEW_BRANCH"
            git reset --hard "origin/$NEW_BRANCH"
            echo "branch_existed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Checked out existing '$NEW_BRANCH'."
          else
            echo "Creating '$NEW_BRANCH' from 'origin/$SUPPORT'..."
            git checkout -b "$NEW_BRANCH" "origin/$SUPPORT"
            echo "branch_existed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Created '$NEW_BRANCH' on top of '$SUPPORT'."
          fi

      # ── STEP 4: Apply commits ─────────────────────────────────────────────
      - name: Apply changes via cherry-pick
        id: cherry_pick
        env:
          COMMITS_CSV:  ${{ steps.get_commits.outputs.commits }}
          COMMIT_COUNT: ${{ steps.get_commits.outputs.count }}
          SOURCE:       ${{ github.event.inputs.source_branch }}
        run: |
          set +e
          echo "Applying $COMMIT_COUNT commit(s) from '$SOURCE'..."
          echo ""

          IFS=',' read -ra COMMIT_LIST <<< "$COMMITS_CSV"
          for SHA in "${COMMIT_LIST[@]}"; do
            [ -z "$SHA" ] && continue
            SHORT="${SHA:0:7}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Applying $SHORT..."

            # ── Try direct cherry-pick first ─────────────────────────────────
            CHERRY_OUTPUT=$(git cherry-pick "$SHA" 2>&1)
            CHERRY_EXIT=$?

            if [ "$CHERRY_EXIT" -eq 0 ]; then
              echo "  ✅ Applied $SHORT (direct cherry-pick)"
              continue
            fi

            echo "  cherry-pick failed (exit=$CHERRY_EXIT)"
            git cherry-pick --abort 2>/dev/null

            # ── Get list of files changed in this commit ──────────────────────
            CHANGED_FILES=$(git show "$SHA" --name-only --format="" | grep -v '^$' | grep -v '^\.github/')
            echo "  Files in commit: $(echo $CHANGED_FILES | tr '\n' ' ')"

            ALL_OK=true
            for ORIG_FILE in $CHANGED_FILES; do
              BASENAME=$(basename "$ORIG_FILE")
              echo ""
              echo "  Processing: $ORIG_FILE  (filename: $BASENAME)"

              # ── Find file by NAME in current branch ───────────────────────
              TARGET_FILE=$(find . -name "$BASENAME" \
                -not -path "./.git/*" \
                -not -path "./.github/*" \
                2>/dev/null | head -1 | sed 's|^\./||')

              echo "  Found at:   ${TARGET_FILE:-NOT FOUND}"

              if [ -z "$TARGET_FILE" ]; then
                echo "  ⚠️  Skipping '$BASENAME' — not in support branch (may not exist in this release)"
                continue
              fi

              # ── Apply each changed line individually (one substitution per hunk) ──
              printf '%s\n' \
                'import sys,subprocess' \
                'sha,orig,target=sys.argv[1],sys.argv[2],sys.argv[3]' \
                'res=subprocess.run(["git","show",sha,"--",orig],capture_output=True,text=True)' \
                'lines=res.stdout.split("\n")' \
                'content=open(target).read()' \
                'applied=0;skipped=0;i=0' \
                'while i<len(lines):' \
                '  l=lines[i];nxt=lines[i+1] if i+1<len(lines) else ""' \
                '  if l.startswith("-") and not l.startswith("---") and nxt.startswith("+") and not nxt.startswith("+++"):' \
                '    old,new=l[1:],nxt[1:]' \
                '    if old!=new:' \
                '      if old in content:' \
                '        content=content.replace(old,new,1);applied+=1;print("  Replaced: "+repr(old.strip()[:80]))' \
                '      else:' \
                '        print("  SKIP (not in target branch): "+repr(old.strip()[:80]));skipped+=1' \
                '    i+=2;continue' \
                '  i+=1' \
                'if applied>0: open(target,"w").write(content)' \
                'print("  applied="+str(applied)+" skipped="+str(skipped))' \
                > /tmp/apply_patch.py
              python3 /tmp/apply_patch.py "$SHA" "$ORIG_FILE" "$TARGET_FILE"

              APPLY_EXIT=$?
              if [ "$APPLY_EXIT" -ne 0 ]; then
                echo "  ❌ Failed to apply change to $TARGET_FILE"
                ALL_OK=false
                break
              fi

              git add "$TARGET_FILE"
            done

            if [ "$ALL_OK" = false ]; then
              echo ""
              echo "❌ FAILED — could not apply commit $SHORT"
              exit 1
            fi

            git commit -m "$(git log -1 --format='%s' $SHA) [backported]"
            echo ""
            echo "  ✅ Applied $SHORT (content-based, path-adapted)"
          done

          echo ""
          echo "✅ All $COMMIT_COUNT commit(s) applied successfully."

      # ── STEP 5: Push the new branch ─────────────────────────────────────────
      - name: Push new branch
        env:
          NEW_BRANCH: ${{ github.event.inputs.new_branch_name }}
        run: |
          echo "Pushing '$NEW_BRANCH'..."
          git push origin "$NEW_BRANCH"
          echo ""
          echo "✅ SUCCESS"
          echo "   Branch '$NEW_BRANCH' is now on GitHub with your changes applied."
          echo "   You can open a PR from '$NEW_BRANCH' into '${{ github.event.inputs.support_branch }}'."

      # ── STEP 6: Create Pull Request ─────────────────────────────────────────
      - name: Create Pull Request
        env:
          NEW_BRANCH:   ${{ github.event.inputs.new_branch_name }}
          BASE_BRANCH:  ${{ github.event.inputs.support_branch }}
          PR_TITLE:     ${{ github.event.inputs.pr_title }}
          PR_BODY:      ${{ github.event.inputs.pr_body }}
          GH_TOKEN:     ${{ secrets.RDKCM_RDKE }}
        run: |
          set +e
          # Use new_branch_name as title if pr_title is empty
          TITLE="${PR_TITLE:-Backport ${NEW_BRANCH} into ${BASE_BRANCH}}"
          BODY="${PR_BODY:-Automated backport created by simple-backport workflow.}"

          echo "Creating PR: '$TITLE'"
          echo "  head: $NEW_BRANCH  →  base: $BASE_BRANCH"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d "{\"title\":\"$TITLE\",\"body\":\"$BODY\",\"head\":\"$NEW_BRANCH\",\"base\":\"$BASE_BRANCH\"}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY_RESP=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "201" ]; then
            PR_URL=$(echo "$BODY_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['html_url'])")
            echo ""
            echo "✅ PR created successfully!"
            echo "   $PR_URL"
          elif [ "$HTTP_CODE" = "422" ]; then
            echo ""
            echo "✅ PR already exists for '$NEW_BRANCH' → '$BASE_BRANCH'"
            echo "   New commit was pushed to the branch and appears in the existing PR automatically."
          else
            echo "⚠️  PR creation returned HTTP $HTTP_CODE"
            echo "   (Branch is pushed. Create PR manually if needed)"
            echo "   $BODY_RESP"
          fi
