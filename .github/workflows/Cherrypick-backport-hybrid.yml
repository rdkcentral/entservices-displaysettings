name: PR - Backport to Release Branch

# ================================================================
# HYBRID BACKPORT WORKFLOW
#
# Combines best practices from multiple approaches:
#   - Authoritative conflict detection (git ls-files -u)
#   - Smart merge commit handling (parent count detection)
#   - Simple PR creation (gh CLI)
#   - Intelligent conflict resolution (diff3 + --theirs)
#   - Detailed analysis for debugging
#
# Runs when PR is MERGED into:
#   - dummy_develop
#   - support/**
#   - release/**
#
# PR description must contain:
#   release_version: none     → skip backport
#   release_version: 8.3.4    → backport to support/8.3.4.0
#   release_version: 8.3.4.0  → backport to support/8.3.4.0
#
# ================================================================
# IMPORTANT BEHAVIORS & LIMITATIONS:
# ================================================================
#
# 1. FEATURE BRANCH OVERWRITE:
#    - feature/TICKET is ALWAYS recreated from support branch
#    - Existing commits on feature/TICKET will be LOST
#    - This prevents commit accumulation from multiple backports
#
# 2. UNIQUE BRANCH NAMING:
#    - Branch format: feature/TICKET-PR123-v8.3.4.0
#    - Prevents conflicts from concurrent backports
#    - Each backport gets its own isolated branch
#
# 3. CONFLICT RESOLUTION STRATEGY:
#    - Strategy 1 (diff3): Intelligent 3-way merge
#    - Strategy 2 (--theirs): Replaces ENTIRE file with incoming
#    - ⚠️  Strategy 2 can overwrite critical release-branch changes
#    - ⚠️  Files resolved with --theirs flagged for MANUAL REVIEW
#    - Auto-resolution cannot guarantee semantic correctness
#
# 4. .github FOLDER:
#    - Always excluded from backports
#    - Kept at support branch version
#    - Workflow changes don't flow to release branches
#
# 5. EMPTY CHERRY-PICKS:
#    - If changes already in support branch: no PR created
#    - Workflow reports "NO CHANGES TO COMMIT" (this is normal)
#    - No error - just means already applied
#
# 6. REQUIREMENTS:
#    - gh CLI must be available (built into GitHub Actions)
#    - RDKCM_RDKE token must have repo + PR permissions
#    - Support branch must exist before backport
#
# 7. VALIDATION SCOPE:
#    - CMake: Configuration check only (not full compilation)
#    - C++ syntax: Basic checks only (braces, semicolons)
#    - Manual review still required for semantic correctness
#
# ================================================================

on:
  pull_request:
    types: [closed]
    branches:
      - dummy_develop
      - 'support/**'
      - 'release/**'

# Prevent concurrent backports to same support branch
concurrency:
  group: backport-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:

      # ──────────────────────────────────────────────────────────
      # STEP 0: Checkout & Configure
      # ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RDKCM_RDKE }}

      - name: Configure Git
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions [Backport]"
          git config user.email "github-actions@users.noreply.github.com"


      # ──────────────────────────────────────────────────────────
      # STEP 1: Extract & Validate PR Info
      # ──────────────────────────────────────────────────────────
      - name: Extract PR information
        id: info
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          
          echo "═══════════════════════════════════════════════════════════"
          echo "BACKPORT WORKFLOW"
          echo "═══════════════════════════════════════════════════════════"
          echo "PR #$PR_NUMBER: $PR_TITLE"
          echo "Source branch: $PR_BRANCH"
          echo "Merge SHA: $MERGE_SHA"
          echo "═══════════════════════════════════════════════════════════"
          
          # Validate merge SHA
          if [[ -z "$MERGE_SHA" ]]; then
            echo "❌ ERROR: merge_commit_sha is empty"
            exit 1
          fi
          
          # Extract release_version (case insensitive, flexible, supports multi-line)
          RAW_LINE=$(echo "$PR_BODY" | grep -iE '^\s*release[_-]?version\s*:' | head -1 || true)
          
          if [ -n "$RAW_LINE" ]; then
            # Try to extract value from same line
            VERSION=$(echo "$RAW_LINE" | sed -E 's/^[^:]*:\s*//' | sed 's/#.*//' | xargs || true)
            
            # If empty, check next non-empty line (multi-line YAML)
            if [ -z "$VERSION" ]; then
              LINE_NUM=$(echo "$PR_BODY" | grep -inE '^\s*release[_-]?version\s*:' | head -1 | cut -d: -f1)
              NEXT_LINE=$(echo "$PR_BODY" | tail -n +$((LINE_NUM + 1)) | grep -v '^[[:space:]]*$' | head -1 | sed 's/#.*//' | xargs || true)
              
              # Validate it looks like a version or 'none' (not random text)
              if [[ "$NEXT_LINE" =~ ^([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?|none)$ ]]; then
                VERSION="$NEXT_LINE"
              else
                echo "⚠️  WARNING: Multi-line value doesn't look like a version: '$NEXT_LINE'"
                VERSION=""
              fi
            fi
          else
            VERSION=""
          fi
          
          if [[ -z "$VERSION" ]]; then
            echo "❌ ERROR: release_version not found in PR description"
            echo "   Add: release_version: none  OR  release_version: 8.3.4.0"
            exit 1
          fi
          
          echo "release_version: $VERSION"
          
          # Handle "none" - skip backport
          if [[ "${VERSION,,}" == "none" ]]; then
            echo "✅ release_version: none — no backport needed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Validate version format (X.Y.Z or X.Y.Z.W)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "❌ ERROR: Invalid version format: $VERSION"
            echo "   Valid: 8.3.4  or  8.3.4.0"
            exit 1
          fi
          
          # Normalize to support/X.Y.Z.W
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            SUPPORT_BRANCH="support/${VERSION}.0"
          else
            SUPPORT_BRANCH="support/${VERSION}"
          fi
          
          # Extract ticket from branch name
          TICKET=$(echo "$PR_BRANCH" | grep -oE '[A-Z]+-[0-9]+' | head -1 || echo "BACKPORT")
          
          # UNIQUE BRANCH NAME: Prevents conflicts from concurrent backports
          # Format: feature/TICKET-PR123-v8.3.4.0
          FEATURE_BRANCH="feature/${TICKET}-PR${PR_NUMBER}-v${VERSION}"
          
          # Set outputs
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "support_branch=$SUPPORT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "feature_branch=$FEATURE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          
          echo ""
          echo "Backport plan:"
          echo "  Ticket: $TICKET"
          echo "  Target: $SUPPORT_BRANCH"
          echo "  Feature: $FEATURE_BRANCH"


      # ──────────────────────────────────────────────────────────
      # STEP 2: Validate Support Branch Exists
      # ──────────────────────────────────────────────────────────
      - name: Validate target branch
        if: steps.info.outputs.skip != 'true'
        env:
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
        run: |
          set -euo pipefail
          
          git fetch origin "refs/heads/${SUPPORT_BRANCH}:refs/remotes/origin/${SUPPORT_BRANCH}" || {
            echo "❌ ERROR: Branch not found: $SUPPORT_BRANCH"
            echo ""
            echo "Available support branches:"
            git ls-remote --heads origin 'refs/heads/support/*' | sed 's#.*refs/heads/##' | sort
            exit 1
          }
          
          echo "✅ Target branch exists: $SUPPORT_BRANCH"


      # ──────────────────────────────────────────────────────────
      # STEP 3: Create Fresh Feature Branch
      # ──────────────────────────────────────────────────────────
      - name: Create feature branch
        if: steps.info.outputs.skip != 'true'
        env:
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
        run: |
          set -euo pipefail
          
          # Fetch remote feature branch if exists (for --force-with-lease)
          git fetch origin "refs/heads/${FEATURE_BRANCH}:refs/remotes/origin/${FEATURE_BRANCH}" 2>/dev/null || true
          
          # ALWAYS recreate from support branch (prevents commit accumulation)
          git checkout -B "$FEATURE_BRANCH" "origin/$SUPPORT_BRANCH"
          
          echo "✅ Feature branch ready: $FEATURE_BRANCH"


      # ──────────────────────────────────────────────────────────
      # STEP 4: Cherry-Pick with Smart Conflict Resolution
      # ──────────────────────────────────────────────────────────
      - name: Cherry-pick changes
        if: steps.info.outputs.skip != 'true'
        id: pick
        env:
          MERGE_SHA: ${{ steps.info.outputs.merge_sha }}
        run: |
          set -euo pipefail
          
          echo "═══════════════════════════════════════════════════════════"
          echo "CHERRY-PICK"
          echo "═══════════════════════════════════════════════════════════"
          
          git fetch origin "$MERGE_SHA"
          
          # Detect merge commit vs normal commit (from latest.yml)
          PARENT_COUNT=$(git rev-list --parents -n 1 "$MERGE_SHA" | awk '{print NF-1}')
          echo "Commit type: $([ "$PARENT_COUNT" -gt 1 ] && echo 'MERGE' || echo 'NORMAL') ($PARENT_COUNT parent(s))"
          
          # Cherry-pick with appropriate flags
          set +e
          if [[ "$PARENT_COUNT" -gt 1 ]]; then
            git cherry-pick -m 1 --no-commit "$MERGE_SHA"
          else
            git cherry-pick --no-commit "$MERGE_SHA"
          fi
          PICK_EXIT=$?
          set -e
          
          echo "Cherry-pick exit code: $PICK_EXIT"
          
          # ════════════════════════════════════════════════════════
          # AUTHORITATIVE CONFLICT DETECTION (from latest.yml)
          # ════════════════════════════════════════════════════════
          CONFLICT_FILES=$(git ls-files -u | cut -f2 | sort -u || true)
          
          if [[ -n "$CONFLICT_FILES" ]]; then
            echo ""
            echo "⚠️  CONFLICTS DETECTED:"
            echo "$CONFLICT_FILES"
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          else
            # No conflicts, but check if cherry-pick failed for other reasons
            if [[ $PICK_EXIT -ne 0 ]]; then
              echo ""
              echo "❌ ERROR: Cherry-pick failed (exit code: $PICK_EXIT)"
              echo "   This is NOT a normal conflict - likely a Git error"
              git cherry-pick --abort || true
              exit 1
            fi
            
            echo ""
            echo "✅ No conflicts detected"
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          fi


      # ──────────────────────────────────────────────────────────
      # STEP 5: Analyze Conflicts (if any)
      # ──────────────────────────────────────────────────────────
      - name: Analyze conflicts
        if: steps.info.outputs.skip != 'true' && steps.pick.outputs.has_conflicts == 'true'
        run: |
          set -euo pipefail
          
          echo "═══════════════════════════════════════════════════════════"
          echo "CONFLICT ANALYSIS"
          echo "═══════════════════════════════════════════════════════════"
          
          CONFLICT_FILES=$(git ls-files -u | cut -f2 | sort -u)
          
          for FILE in $CONFLICT_FILES; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📄 $FILE"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Show conflict markers with context
            if [[ -f "$FILE" ]]; then
              awk '
                /^<<<<<<</ { in_conflict=1; print "  ┌─ CONFLICT ─────────────────────" }
                in_conflict { print "  │ " $0 }
                /^>>>>>>>/ { print "  └────────────────────────────────"; in_conflict=0; print "" }
              ' "$FILE" | head -50
            fi
          done


      # ──────────────────────────────────────────────────────────
      # STEP 6: Resolve Conflicts
      # ──────────────────────────────────────────────────────────
      - name: Resolve conflicts
        if: steps.info.outputs.skip != 'true' && steps.pick.outputs.has_conflicts == 'true'
        id: resolve
        run: |
          set -euo pipefail
          
          echo "═══════════════════════════════════════════════════════════"
          echo "CONFLICT RESOLUTION"
          echo "═══════════════════════════════════════════════════════════"
          
          CONFLICT_FILES=$(git ls-files -u | cut -f2 | sort -u)
          TEMP_DIR=$(mktemp -d)
          
          RESOLVED=0
          FAILED=0
          
          for FILE in $CONFLICT_FILES; do
            echo ""
            echo "Resolving: $FILE"
            
            SUCCESS=false
            
            # Skip .github files early (will be removed later anyway)
            if [[ "$FILE" == .github/* ]]; then
              git checkout HEAD -- "$FILE"
              git add "$FILE"
              echo "  ✅ Skipped: .github file (not backported)"
              RESOLVED=$((RESOLVED + 1))
              continue
            fi
            
            # ── Strategy 1: Intelligent 3-way merge with diff3 ────
            git show ":1:$FILE" > "$TEMP_DIR/base.tmp" 2>/dev/null || echo -n "" > "$TEMP_DIR/base.tmp"
            git show ":2:$FILE" > "$TEMP_DIR/ours.tmp" 2>/dev/null || echo -n "" > "$TEMP_DIR/ours.tmp"
            git show ":3:$FILE" > "$TEMP_DIR/theirs.tmp" 2>/dev/null || echo -n "" > "$TEMP_DIR/theirs.tmp"
            
            if [[ -f "$TEMP_DIR/base.tmp" ]] && [[ -f "$TEMP_DIR/ours.tmp" ]] && [[ -f "$TEMP_DIR/theirs.tmp" ]]; then
              if diff3 -m "$TEMP_DIR/ours.tmp" "$TEMP_DIR/base.tmp" "$TEMP_DIR/theirs.tmp" > "$TEMP_DIR/merged.tmp" 2>/dev/null; then
                if ! grep -qE '^(<<<<<<<|=======|>>>>>>>)' "$TEMP_DIR/merged.tmp" 2>/dev/null; then
                  cp "$TEMP_DIR/merged.tmp" "$FILE"
                  git add "$FILE"
                  SUCCESS=true
                  echo "  ✅ Strategy 1: diff3 3-way merge"
                fi
              fi
            fi
            
            # ── Strategy 2: Accept incoming changes (--theirs) ────
            if [[ "$SUCCESS" == "false" ]]; then
              # Show file size before using --theirs (safety check)
              OURS_SIZE=$(wc -l < "$TEMP_DIR/ours.tmp" 2>/dev/null || echo 0)
              THEIRS_SIZE=$(wc -l < "$TEMP_DIR/theirs.tmp" 2>/dev/null || echo 0)
              
              echo "  ⚠️  Strategy 2: Replacing entire file (high risk)"
              echo "      Support branch: ${OURS_SIZE} lines"
              echo "      Incoming:       ${THEIRS_SIZE} lines"
              
              # Normal files: take incoming changes (⚠️  replaces entire file)
              git checkout --theirs -- "$FILE" 2>/dev/null
              if ! grep -qE '^(<<<<<<<|=======|>>>>>>>)' "$FILE" 2>/dev/null; then
                git add "$FILE"
                echo "  ⚠️  APPLIED: Entire file replaced with incoming version"
                echo "  ⚠️  MANUAL REVIEW REQUIRED for this file!"
                SUCCESS=true
              fi
            fi
            
            # Update counters (FIX: avoid arithmetic exit code issues with set -e)
            if [[ "$SUCCESS" == "true" ]]; then
              RESOLVED=$((RESOLVED + 1))
            else
              echo "  ❌ All strategies failed"
              FAILED=$((FAILED + 1))
            fi
          done
          
          rm -rf "$TEMP_DIR"
          
          echo ""
          echo "Resolution summary: $RESOLVED resolved, $FAILED failed"
          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"


      # ──────────────────────────────────────────────────────────
      # STEP 7: Verify & Commit
      # ──────────────────────────────────────────────────────────
      - name: Verify and commit
        if: steps.info.outputs.skip != 'true'
        id: commit
        env:
          TICKET: ${{ steps.info.outputs.ticket }}
          VERSION: ${{ steps.info.outputs.version }}
          PR_TITLE: ${{ steps.info.outputs.pr_title }}
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
        run: |
          set -euo pipefail
          
          # Final conflict check (authoritative)
          REMAINING=$(git ls-files -u | cut -f2 | sort -u || true)
          
          if [[ -n "$REMAINING" ]]; then
            echo "❌ ERROR: Unresolved conflicts remain:"
            echo "$REMAINING"
            git cherry-pick --abort || true
            exit 1
          fi
          
          # Safety: Check for conflict markers in text files (with context to avoid false positives)
          # Look for markers at start of line followed by space or branch name
          MARKER_FILES=$(git grep -IlE '^<<<<<<<[[:space:]]|^=======$|^>>>>>>>[[:space:]]' -- . ':!/.git/' 2>/dev/null || true)
          
          if [[ -n "$MARKER_FILES" ]]; then
            echo ""
            echo "❌ ERROR: Conflict markers found in files:"
            echo "$MARKER_FILES"
            echo ""
            echo "These appear to be real conflict markers, not legitimate content."
            echo "Please resolve all conflicts before committing."
            git cherry-pick --abort || true
            exit 1
          fi
          
          # Remove .github changes (don't backport workflow changes)
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo "Removing .github changes from backport"
            git restore --source=HEAD --staged --worktree -- .github/
          fi
          
          # Check if anything to commit
          if git diff --cached --quiet; then
            echo ""
            echo "═══════════════════════════════════════════════════════════"
            echo "ℹ️  NO CHANGES TO COMMIT"
            echo "═══════════════════════════════════════════════════════════"
            echo "The changes from PR are already present in $SUPPORT_BRANCH"
            echo "or the cherry-pick resulted in no actual differences."
            echo ""
            echo "This is NORMAL and not an error."
            echo "═══════════════════════════════════════════════════════════"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
                    # Clear cherry-pick state (important after conflict resolution)
          # This ensures we're in a clean state before committing
          if [[ "${{ steps.pick.outputs.has_conflicts }}" == "true" ]]; then
            echo "Clearing cherry-pick state after conflict resolution..."
            git cherry-pick --quit || true
          fi
                    # Show what will be committed
          echo ""
          echo "Files to commit:"
          git diff --cached --name-status
          
          # ═══════════════════════════════════════════════════════
          # SYNTAX VALIDATION (BEFORE COMMIT)
          # ═══════════════════════════════════════════════════════
          echo ""
          echo "Running syntax validation BEFORE commit..."
          
          SYNTAX_ERRORS=0
          
          # Check C/C++ files for basic syntax issues
          # NOTE: This is intentionally a rough check (comments/strings/macros may cause false positives)
          if git diff --cached --name-only | grep -qE '\.(cpp|c|cc|cxx|h|hpp)$'; then
            echo "  Checking C++ files for syntax errors (basic checks only)..."
            for CPPFILE in $(git diff --cached --name-only | grep -E '\.(cpp|c|cc|cxx|h|hpp)$'); do
              if [[ -f "$CPPFILE" ]]; then
                # Check for unbalanced braces
                OPEN=$(grep -o '{' "$CPPFILE" | wc -l)
                CLOSE=$(grep -o '}' "$CPPFILE" | wc -l)
                if [[ $OPEN -ne $CLOSE ]]; then
                  echo "  ❌ ERROR: $CPPFILE has unbalanced braces (${OPEN} open, ${CLOSE} close)"
                  SYNTAX_ERRORS=$((SYNTAX_ERRORS + 1))
                else
                  echo "  ✅ $CPPFILE: braces balanced"
                fi
                
                # Check for obvious syntax issues
                if grep -qE ';[[:space:]]*;' "$CPPFILE"; then
                  echo "  ⚠️  WARNING: $CPPFILE contains double semicolons (;;)"
                fi
              fi
            done
          fi
          
          if [[ $SYNTAX_ERRORS -gt 0 ]]; then
            echo ""
            echo "❌ SYNTAX VALIDATION FAILED: $SYNTAX_ERRORS error(s) found"
            echo "   Aborting commit to prevent broken code"
            git cherry-pick --abort || true
            exit 1
          fi
          
          echo "  ✅ Syntax validation passed"
          
          # ═══════════════════════════════════════════════════════
          # COMMIT
          # ═══════════════════════════════════════════════════════
          echo ""
          if [[ "${{ steps.pick.outputs.has_conflicts }}" == "true" ]]; then
            MSG="${TICKET}: Backport to support/${VERSION} — ${PR_TITLE} [conflicts auto-resolved]"
          else
            MSG="${TICKET}: Backport to support/${VERSION} — ${PR_TITLE}"
          fi
          
          git commit -m "$MSG"
          
          echo "✅ Committed: $(git log -1 --oneline)"
          echo "committed=true" >> "$GITHUB_OUTPUT"


      # ──────────────────────────────────────────────────────────
      # STEP 8: Build Validation (CMake Configuration Only)
      # NOTE: This validates CMake configuration, NOT full compilation
      # ──────────────────────────────────────────────────────────
      - name: CMake configuration check
        if: steps.info.outputs.skip != 'true' && steps.commit.outputs.committed == 'true'
        continue-on-error: false
        id: build
        run: |
          set -euo pipefail
          
          echo "═══════════════════════════════════════════════════════════"
          echo "BUILD VALIDATION"
          echo "═══════════════════════════════════════════════════════════"
          
          # Only check if build files exist
          if [[ -f "CMakeLists.txt" ]]; then
            echo "CMake project detected - validating configuration..."
            
            # CMake configure check
            mkdir -p build_test
            cd build_test
            
            if cmake .. -DCMAKE_BUILD_TYPE=Debug 2>&1 | tee cmake_output.log; then
              echo "✅ CMake configuration successful"
              echo "build_ok=true" >> "$GITHUB_OUTPUT"
            else
              echo ""
              echo "❌ CMake configuration FAILED"
              echo "═══════════════════════════════════════════════════════════"
              tail -30 cmake_output.log
              echo "═══════════════════════════════════════════════════════════"
              echo "build_ok=false" >> "$GITHUB_OUTPUT"
              cd ..
              rm -rf build_test
              
              echo ""
              echo "❌ BUILD VALIDATION FAILED - preventing backport PR creation"
              echo "   Fix the build errors before creating backport PR"
              exit 1
            fi
            
            cd ..
            rm -rf build_test
          else
            echo "ℹ️  No CMakeLists.txt found - skipping build check"
            echo "build_ok=unknown" >> "$GITHUB_OUTPUT"
          fi


      # ──────────────────────────────────────────────────────────
      # STEP 9: Push Feature Branch
      # ──────────────────────────────────────────────────────────
      - name: Push changes
        if: steps.info.outputs.skip != 'true' && steps.commit.outputs.committed == 'true'
        env:
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
        run: |
          set -euo pipefail
          
          git push origin "$FEATURE_BRANCH" --force-with-lease
          
          echo "✅ Pushed: $FEATURE_BRANCH"


      # ──────────────────────────────────────────────────────────
      # STEP 10: Create Backport PR (with gh CLI)
      # ──────────────────────────────────────────────────────────
      - name: Create backport PR
        if: steps.info.outputs.skip != 'true' && steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RDKCM_RDKE }}
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
          TICKET: ${{ steps.info.outputs.ticket }}
          VERSION: ${{ steps.info.outputs.version }}
          PR_TITLE: ${{ steps.info.outputs.pr_title }}
          ORIGINAL_PR: ${{ steps.info.outputs.pr_url }}
          HAD_CONFLICTS: ${{ steps.pick.outputs.has_conflicts }}
        run: |
          set -euo pipefail
          
          echo "═══════════════════════════════════════════════════════════"
          echo "CREATE BACKPORT PR"
          echo "═══════════════════════════════════════════════════════════"
          
          # Check if PR already exists
          EXISTING=$(gh pr list \
            --head "$FEATURE_BRANCH" \
            --base "$SUPPORT_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url' || true)
          
          if [[ -n "$EXISTING" ]]; then
            echo "ℹ️  PR already exists: $EXISTING"
            exit 0
          fi
          
          # Build PR title and body
          BUILD_WARNING=""
          if [[ "${{ steps.build.outputs.build_ok }}" == "false" ]]; then
            BUILD_WARNING="\n\n🔴 **BUILD CHECK FAILED** — CMake configuration had errors. Manual review required."
          fi
          
          if [[ "$HAD_CONFLICTS" == "true" ]]; then
            TITLE="${TICKET}: Backport into support/${VERSION} [conflicts auto-resolved]"
            BODY="${TICKET}: Backport of **${PR_TITLE}** into \`${SUPPORT_BRANCH}\`.

          🚨 **CRITICAL: Conflicts were auto-resolved** 🚨
          
          ⚠️  **MANUAL REVIEW REQUIRED** — Auto-resolution may not be semantically correct:
          - Some files may have been entirely replaced (--theirs strategy)
          - Business logic may need adjustment for release branch
          - Test the changes thoroughly before merging${BUILD_WARNING}

          ---
          **Original PR:** ${ORIGINAL_PR}

          release_version: none"
          else
            TITLE="${TICKET}: Backport into support/${VERSION}"
            BODY="${TICKET}: Backport of **${PR_TITLE}** into \`${SUPPORT_BRANCH}\`.

          ✅ Clean cherry-pick (no conflicts)${BUILD_WARNING}

          ---
          **Original PR:** ${ORIGINAL_PR}

          release_version: none"
          fi
          
          # Create PR with gh CLI
          PR_URL=$(gh pr create \
            --head "$FEATURE_BRANCH" \
            --base "$SUPPORT_BRANCH" \
            --title "$TITLE" \
            --body "$BODY")
          
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ BACKPORT PR CREATED"
          echo "═══════════════════════════════════════════════════════════"
          echo "$PR_URL"
          echo "═══════════════════════════════════════════════════════════"
