      # ── Output consolidation for downstream steps ─────────────────────────────
      - name: Set final apply status
        if: steps.info.outputs.skip != 'true'
        id: apply
        run: |
          # Only runs if NO conflicts (Phase 2 exits with error if conflicts detected)
          if [ "${{ steps.cherry_pick.outputs.committed }}" = "true" ]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            echo "conflict_resolved=false" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            echo "conflict_resolved=false" >> "$GITHUB_OUTPUT"
          fi

     # ── 5. Push feature branch ───────────────────────────────────────────────
      - name: Push feature branch
        if: steps.info.outputs.skip != 'true' && steps.apply.outputs.applied == 'true'
        env:
          FEATURE_BRANCH: ${{ steps.setup_feature.outputs.feature_branch }}
        run: |
          set -euo pipefail

          if [ -z "$FEATURE_BRANCH" ]; then
            echo "FEATURE_BRANCH is empty"
            exit 1
          fi

          git push origin "$FEATURE_BRANCH" --force-with-lease


          # ── 6. Create Pull Request ───────────────────────────────────────────────
      - name: Create Pull Request
        if: steps.info.outputs.skip != 'true' && steps.apply.outputs.applied == 'true'
        env:
          GH_TOKEN:          ${{ secrets.RDKCM_RDKE }}
          FEATURE_BRANCH:    ${{ steps.setup_feature.outputs.feature_branch }}
          SUPPORT_BRANCH:    ${{ steps.info.outputs.support_branch }}
          TICKET:            ${{ steps.info.outputs.ticket }}
          VERSION:           ${{ steps.info.outputs.version }}
          PR_TITLE:          ${{ steps.info.outputs.pr_title }}
          ORIGINAL_PR:       ${{ steps.info.outputs.pr_url }}
          CONFLICT_RESOLVED: ${{ steps.apply.outputs.conflict_resolved }}
        run: |
          set -euo pipefail

          EXISTING=$(gh pr list \
            --head "$FEATURE_BRANCH" \
            --base "$SUPPORT_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url' || true)

          if [ -n "$EXISTING" ]; then
            echo "PR already exists: $EXISTING"
            exit 0
          fi

          # Use the original merged PR title for the backport PR
          TITLE="${PR_TITLE}"

          if [ "$CONFLICT_RESOLVED" = "true" ]; then
            BODY="${TICKET}: Backport of **${PR_TITLE}** into \`${SUPPORT_BRANCH}\`.

          ⚠️ **Conflicts were auto-resolved** — please review carefully before merging.

          ---
          **Original PR:** ${ORIGINAL_PR}

          release_version: none"
          else
            BODY="${TICKET}: Backport of **${PR_TITLE}** into \`${SUPPORT_BRANCH}\`.

          ---
          **Original PR:** ${ORIGINAL_PR}

          release_version: none"
          fi

          gh pr create \
            --head "$FEATURE_BRANCH" \
            --base "$SUPPORT_BRANCH" \
            --title "$TITLE" \
            --body "$BODY"
