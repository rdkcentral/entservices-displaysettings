      # ── 4a. Apply PR changes and detect real conflicts ────────────────────────
      # ── 4a. Apply PR changes and detect real conflicts ────────────────────────
      - name: "Phase 1: Apply PR changes and detect conflicts"
        if: steps.info.outputs.skip != 'true'
        id: cherry_pick
        env:
          MERGE_SHA:      ${{ steps.info.outputs.merge_sha }}
          TICKET:         ${{ steps.info.outputs.ticket }}
          VERSION:        ${{ steps.info.outputs.version }}
          PR_TITLE:       ${{ steps.info.outputs.pr_title }}
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
        run: |
          set -euo pipefail

          # ═══════════════════════════════════════════════════════════════════
          # VALIDATE INPUT
          # ═══════════════════════════════════════════════════════════════════

          if [ -z "$MERGE_SHA" ] || [ -z "$TICKET" ] || \
            [ -z "$VERSION" ] || [ -z "$FEATURE_BRANCH" ]; then
            echo "❌ FATAL: Required environment variables are missing"
            exit 1
          fi

          echo "▶ Processing commit: $MERGE_SHA"
          echo "▶ Target feature branch: $FEATURE_BRANCH"
          echo ""

          # ═══════════════════════════════════════════════════════════════════
          # DETECT COMMIT TYPE
          # ═══════════════════════════════════════════════════════════════════

          PARENT_INFO=$(git rev-list --parents -n 1 "$MERGE_SHA")
          PARENT_COUNT=$(echo "$PARENT_INFO" | awk '{print NF-1}')

          echo "Commit type: $(
            [ "$PARENT_COUNT" -gt 1 ] && echo 'MERGE' || echo 'NORMAL'
          ) ($PARENT_COUNT parent(s))"


          # ═══════════════════════════════════════════════════════════════════
          # MERGE COMMIT
          # ═══════════════════════════════════════════════════════════════════

          if [ "$PARENT_COUNT" -gt 1 ]; then

            PARENT1=$(echo "$PARENT_INFO" | awk '{print $2}')

            if [ -z "$PARENT1" ]; then
              echo "❌ FATAL: Could not determine parent 1"
              exit 1
            fi

            echo ""
            echo "╔══════════════════════════════════════════════════════════════════╗"
            echo "║                    🔀 MERGE COMMIT                              ║"
            echo "╚══════════════════════════════════════════════════════════════════╝"
            echo ""
            echo "Merge commit : $MERGE_SHA"
            echo "Parent 1     : $PARENT1"
            echo ""


            # ═════════════════════════════════════════════════════════════════
            # FIND ACTUAL PR CHANGES
            # ═════════════════════════════════════════════════════════════════

            echo "▶ Calculating files changed by the PR..."

            ALL_CHANGED=$(
              git diff --name-only "$PARENT1" "$MERGE_SHA" \
              -- ':!.github/*' 2>/dev/null || true
            )

            TOTAL_COUNT=$(echo "$ALL_CHANGED" | grep -v '^$' | wc -l | tr -d ' ')

            if [ "$TOTAL_COUNT" -eq 0 ]; then
              echo "ℹ️ No code changes to backport."

              echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
              echo "committed=false" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            echo "📊 Total code files affected: $TOTAL_COUNT"
            echo ""

            echo "✅ Code files:"
            echo "$ALL_CHANGED" | while IFS= read -r f; do
              if [ -n "$f" ]; then
                echo "   • $f"
              fi
            done


            # ═════════════════════════════════════════════════════════════════
            # GENERATE PATCH
            #
            # IMPORTANT:
            #
            # Use REAL CONTEXT.
            #
            # Do NOT use --unified=0.
            #
            # The surrounding source code allows Git to identify the exact
            # location inside sendMsgThread(), rather than merely inserting
            # the line somewhere in the file.
            # ═════════════════════════════════════════════════════════════════

            echo ""
            echo "▶ Generating actual PR change with source context..."

            git diff \
              --binary \
              --full-index \
              --unified=20 \
              "$PARENT1" "$MERGE_SHA" \
              -- ':!.github/*' \
              > /tmp/backport.patch

            if [ ! -s /tmp/backport.patch ]; then
              echo "ℹ️ No code changes to backport."

              echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
              echo "committed=false" >> "$GITHUB_OUTPUT"

              exit 0
            fi


            # ═════════════════════════════════════════════════════════════════
            # MAP SOURCE PATH → RELEASE PATH
            # ═════════════════════════════════════════════════════════════════

            sed -i \
              's#plugin/DisplaySettings\.cpp#DisplaySettings/DisplaySettings.cpp#g' \
              /tmp/backport.patch

            echo "📍 Source path mapped to release path where required."


            # ═════════════════════════════════════════════════════════════════
            # REMOVE FILE-MODE-ONLY INFORMATION
            #
            # 100644 vs 100755 must not create a content conflict.
            # ═════════════════════════════════════════════════════════════════

            sed -i \
              -e '/^old mode /d' \
              -e '/^new mode /d' \
              -e '/^new file mode /d' \
              -e '/^deleted file mode /d' \
              /tmp/backport.patch


            # ═════════════════════════════════════════════════════════════════
            # SHOW PATCH
            # ═════════════════════════════════════════════════════════════════

            echo ""
            echo "╔══════════════════════════════════════════════════════════════════╗"
            echo "║                    📦 PR CHANGE                                 ║"
            echo "╚══════════════════════════════════════════════════════════════════╝"
            echo ""

            cat /tmp/backport.patch

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


            # ═════════════════════════════════════════════════════════════════
            # EXTRACT EXPECTED FUNCTION CONTEXT
            #
            # Example:
            #
            # @@ ... @@ void DisplaySettings::sendMsgThread()
            #
            # We remember that function.
            #
            # After applying the patch we verify that the changed code is
            # still inside that expected function.
            # ═════════════════════════════════════════════════════════════════

            EXPECTED_FUNCTIONS=$(
              grep '^@@' /tmp/backport.patch |
              sed 's/^.*@@[[:space:]]*//' |
              sed 's/^.*@@[[:space:]]*//' |
              grep -E '[A-Za-z_][A-Za-z0-9_:<>~]*[[:space:]]*\(' |
              sed 's/^[[:space:]]*//' |
              sort -u || true
            )

            echo ""
            echo "▶ Expected function context:"

            if [ -n "$EXPECTED_FUNCTIONS" ]; then
              echo "$EXPECTED_FUNCTIONS" | while IFS= read -r f; do
                [ -n "$f" ] && echo "   • $f"
              done
            else
              echo "   ℹ️ Function context not available in patch."
            fi


            # ═════════════════════════════════════════════════════════════════
            # ATTEMPT 1 — CLEAN DIRECT APPLICATION
            #
            # First try normal patch application.
            #
            # If Git can find the exact surrounding source context:
            #
            #     apply
            #       ↓
            #     validate location
            #       ↓
            #     commit
            #
            # No 4b.
            # ═════════════════════════════════════════════════════════════════

            echo ""
            echo "▶ Checking whether PR changes apply cleanly..."

            set +e

            git apply \
              --check \
              --ignore-space-change \
              --ignore-whitespace \
              /tmp/backport.patch

            CHECK_EXIT=$?

            set -e


            # ═════════════════════════════════════════════════════════════════
            # CLEAN PATCH
            # ═════════════════════════════════════════════════════════════════

            if [ "$CHECK_EXIT" -eq 0 ]; then

              echo ""
              echo "✅ Git reports a clean patch."
              echo "▶ Applying PR changes..."

              git apply \
                --index \
                --ignore-space-change \
                --ignore-whitespace \
                /tmp/backport.patch


              # ═══════════════════════════════════════════════════════════════
              # AUTHORITATIVE GIT CONFLICT CHECK
              # ═══════════════════════════════════════════════════════════════

              REAL_CONFLICTS=$(
                git ls-files -u |
                cut -f2 |
                sort -u |
                grep -v '^\.github/' || true
              )

              if [ -n "$REAL_CONFLICTS" ]; then

                echo ""
                echo "⚠️ Git reports unresolved conflicts."

                echo "$REAL_CONFLICTS" > /tmp/conflict_files.txt

                CONFLICT_COUNT=$(echo "$REAL_CONFLICTS" | grep -c . || true)

                echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
                echo "committed=false" >> "$GITHUB_OUTPUT"
                echo "conflict_count=$CONFLICT_COUNT" >> "$GITHUB_OUTPUT"

                exit 0
              fi


              # ═══════════════════════════════════════════════════════════════
              # LOCATION VALIDATION
              #
              # This is the IMPORTANT NEW PROTECTION.
              #
              # A clean git apply is NOT enough.
              #
              # We inspect the resulting staged diff and verify that the
              # expected function context is present.
              # ═══════════════════════════════════════════════════════════════

              LOCATION_OK=true

              if [ -n "$EXPECTED_FUNCTIONS" ]; then

                echo ""
                echo "▶ Validating change location..."

                STAGED_FUNCTION_CONTEXT=$(
                  git diff --cached --function-context -- \
                    'DisplaySettings/*.cpp' \
                    'plugin/*.cpp' \
                    2>/dev/null || true
                )

                while IFS= read -r EXPECTED_FUNC; do

                  [ -z "$EXPECTED_FUNC" ] && continue

                  # Extract the function name before '('.
                  FUNC_NAME=$(
                    echo "$EXPECTED_FUNC" |
                    sed 's/(.*//' |
                    awk '{print $NF}' |
                    tr -d '*&'
                  )

                  if [ -z "$FUNC_NAME" ]; then
                    continue
                  fi

                  if ! echo "$STAGED_FUNCTION_CONTEXT" | grep -Fq "$FUNC_NAME"; then

                    echo ""
                    echo "❌ LOCATION VALIDATION FAILED"
                    echo "   Expected function: $FUNC_NAME"
                    echo "   The changed code could not be verified inside"
                    echo "   the expected function."

                    LOCATION_OK=false
                  else
                    echo "   ✅ Verified function: $FUNC_NAME"
                  fi

                done <<< "$EXPECTED_FUNCTIONS"

              else

                echo ""
                echo "ℹ️ No function context available for validation."

              fi


              # ═══════════════════════════════════════════════════════════════
              # LOCATION IS WRONG
              #
              # IMPORTANT:
              #
              # Do NOT commit.
              # Do NOT claim success.
              #
              # Send it to 4b as an unresolved backport/application problem.
              # ═══════════════════════════════════════════════════════════════

              if [ "$LOCATION_OK" != "true" ]; then

                echo ""
                echo "╔══════════════════════════════════════════════════════════════════╗"
                echo "║              ⚠️ UNSAFE PATCH LOCATION                          ║"
                echo "╚══════════════════════════════════════════════════════════════════╝"
                echo ""
                echo "Git applied the patch, but the resulting change could not"
                echo "be verified in the expected function/location."
                echo ""
                echo "➡️ Sending to Phase 4b for analysis."

                # Keep the changed file available for Phase 4b analysis.
                git diff --cached > /tmp/applied_backport.diff || true

                CONFLICT_FILES=$(
                  git diff --cached --name-only |
                  grep -v '^\.github/' || true
                )

                if [ -z "$CONFLICT_FILES" ]; then
                  CONFLICT_FILES="$ALL_CHANGED"
                fi

                echo "$CONFLICT_FILES" > /tmp/conflict_files.txt

                CONFLICT_COUNT=$(echo "$CONFLICT_FILES" | grep -c . || true)

                echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
                echo "committed=false" >> "$GITHUB_OUTPUT"
                echo "conflict_count=$CONFLICT_COUNT" >> "$GITHUB_OUTPUT"

                # IMPORTANT:
                # 4a completed detection.
                # 4b will run because has_conflicts=true.
                exit 0
              fi


              # ═══════════════════════════════════════════════════════════════
              # CLEAN + CORRECT LOCATION
              #
              # This is the SUCCESS path.
              # ═══════════════════════════════════════════════════════════════

              echo ""
              echo "╔══════════════════════════════════════════════════════════════════╗"
              echo "║          ✅ CLEAN + CORRECT BACKPORT                            ║"
              echo "╠══════════════════════════════════════════════════════════════════╣"
              echo "║ PR changes applied at the expected source location.             ║"
              echo "║                                                                  ║"
              echo "║ Result: commit → push → PR                                      ║"
              echo "╚══════════════════════════════════════════════════════════════════╝"
              echo ""

              git diff --cached --stat

              if git diff --cached --quiet; then

                echo "ℹ️ No staged changes."

                echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
                echo "committed=false" >> "$GITHUB_OUTPUT"

                exit 0
              fi

              echo ""
              echo "▶ Committing clean backport..."

              git commit \
                -m "${TICKET}: Backport to support/${VERSION} — ${PR_TITLE}"

              echo "✅ Changes committed successfully."

              echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
              echo "committed=true" >> "$GITHUB_OUTPUT"

              # STOP 4a.
              #
              # 4b condition checks has_conflicts.
              # It is false, so 4b will NOT execute.
              exit 0
            fi


            # ═════════════════════════════════════════════════════════════════
            # DIRECT APPLY FAILED
            #
            # Now use 3-way application only to determine whether Git sees a
            # genuine unresolved conflict.
            # ═════════════════════════════════════════════════════════════════

            echo ""
            echo "⚠️ Direct patch application failed."
            echo "▶ Trying 3-way application..."

            set +e

            git apply \
              --3way \
              --ignore-space-change \
              --ignore-whitespace \
              --index \
              /tmp/backport.patch

            PATCH_EXIT=$?

            set -e


            # ═════════════════════════════════════════════════════════════════
            # CHECK REAL GIT CONFLICT
            # ═════════════════════════════════════════════════════════════════

            REAL_CONFLICTS=$(
              git ls-files -u |
              cut -f2 |
              sort -u |
              grep -v '^\.github/' || true
            )


            if [ -n "$REAL_CONFLICTS" ]; then

              CONFLICT_COUNT=$(echo "$REAL_CONFLICTS" | grep -c . || true)

              echo ""
              echo "╔══════════════════════════════════════════════════════════════════╗"
              echo "║                  ⚠️ REAL CONFLICT                              ║"
              echo "╚══════════════════════════════════════════════════════════════════╝"
              echo ""

              echo "Conflicting files: $CONFLICT_COUNT"

              echo "$REAL_CONFLICTS" | while IFS= read -r f; do
                echo "  ❌ $f"
              done

              echo "$REAL_CONFLICTS" > /tmp/conflict_files.txt

              echo ""
              echo "➡️ Sending to Phase 4b for analysis."

              echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
              echo "committed=false" >> "$GITHUB_OUTPUT"
              echo "conflict_count=$CONFLICT_COUNT" >> "$GITHUB_OUTPUT"

              # 4b WILL run.
              exit 0
            fi


            # ═════════════════════════════════════════════════════════════════
            # PATCH FAILED BUT THERE IS NO REAL GIT CONFLICT
            #
            # This is an application problem, not a merge conflict.
            # Do NOT pretend it is a conflict.
            # ═════════════════════════════════════════════════════════════════

            echo ""
            echo "❌ PR patch could not be applied."
            echo "❌ No unresolved Git conflict was detected."
            echo ""
            echo "This is an application/path/patch problem."
            echo "Stopping safely."

            git reset --merge 2>/dev/null || git reset --hard HEAD

            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "conflict_count=0" >> "$GITHUB_OUTPUT"

            exit 1

          fi


          # ═══════════════════════════════════════════════════════════════════
          # NORMAL COMMIT
          # ═══════════════════════════════════════════════════════════════════

          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║                    NORMAL COMMIT                                ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""

          echo "▶ Cherry-picking commit: $MERGE_SHA"

          set +e

          git cherry-pick --no-commit "$MERGE_SHA" 2>&1

          CP_EXIT=$?

          set -e

          echo "cherry_pick_exit=$CP_EXIT" >> "$GITHUB_OUTPUT"


          # ═══════════════════════════════════════════════════════════════════
          # REMOVE .github CONFLICTS
          # ═══════════════════════════════════════════════════════════════════

          GITHUB_CONFLICTS=$(
            git diff --name-only --diff-filter=U 2>/dev/null |
            grep '^\.github/' || true
          )

          if [ -n "$GITHUB_CONFLICTS" ]; then

            echo "Excluding .github/ conflicts:"

            echo "$GITHUB_CONFLICTS" | while IFS= read -r f; do

              if [ -n "$f" ]; then

                git rm --cached --force "$f" 2>/dev/null || true
                rm -f "$f" 2>/dev/null || true

                echo "  ⛔ $f"
              fi

            done

            git restore --staged .github/ 2>/dev/null || true
            git checkout HEAD -- .github/ 2>/dev/null || true
          fi


          # ═══════════════════════════════════════════════════════════════════
          # AUTHORITATIVE NORMAL-COMMIT CONFLICT CHECK
          # ═══════════════════════════════════════════════════════════════════

          REAL_CONFLICTS=$(
            git ls-files -u |
            cut -f2 |
            sort -u |
            grep -v '^\.github/' || true
          )


          # ═══════════════════════════════════════════════════════════════════
          # NORMAL COMMIT — CLEAN
          # ═══════════════════════════════════════════════════════════════════

          if [ -z "$REAL_CONFLICTS" ]; then

            echo ""
            echo "✅ Normal cherry-pick succeeded with no conflicts."

            if git diff --cached --quiet; then

              echo "ℹ️ No code changes to commit."

              echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
              echo "committed=false" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            git commit \
              -m "${TICKET}: Backport to support/${VERSION} — ${PR_TITLE}"

            echo "✅ Changes committed successfully."

            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
            echo "committed=true" >> "$GITHUB_OUTPUT"

            exit 0
          fi


          # ═══════════════════════════════════════════════════════════════════
          # NORMAL COMMIT — REAL CONFLICT → 4b
          # ═══════════════════════════════════════════════════════════════════

          CONFLICT_COUNT=$(echo "$REAL_CONFLICTS" | grep -c . || true)

          echo ""
          echo "⚠️ Real conflicts detected: $CONFLICT_COUNT file(s)"

          echo "$REAL_CONFLICTS" | while IFS= read -r f; do
            echo "  ❌ $f"
          done

          echo "$REAL_CONFLICTS" > /tmp/conflict_files.txt

          echo ""
          echo "➡️ Sending to Phase 4b for analysis."

          echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          echo "committed=false" >> "$GITHUB_OUTPUT"
          echo "conflict_count=$CONFLICT_COUNT" >> "$GITHUB_OUTPUT"

          # 4b WILL run.
          exit 0

      # ── 4b. Analyze conflicts ─────────────────────────────────────────────────
      - name: "Phase 2: Analyze conflicts"
        if: steps.info.outputs.skip != 'true' && steps.cherry_pick.outputs.has_conflicts == 'true'
        id: analyze
        env:
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
          CONFLICT_COUNT: ${{ steps.cherry_pick.outputs.conflict_count }}
          VERSION:        ${{ steps.info.outputs.version }}
          MERGE_SHA:      ${{ steps.info.outputs.merge_sha }}
        run: |
          set -euo pipefail
          
          if [ ! -f /tmp/conflict_files.txt ]; then
            echo "❌ FATAL: Conflict file list not found"
            exit 1
          fi
          
          mapfile -t CONFLICT_FILES < /tmp/conflict_files.txt
          
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║           ⚠️  MERGE CONFLICTS DETECTED                          ║"
          echo "╠══════════════════════════════════════════════════════════════════╣"
          echo "║  Conflicts      : $CONFLICT_COUNT file(s)"
          echo "║  Feature branch : $FEATURE_BRANCH"
          echo "║  Support branch : $SUPPORT_BRANCH"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""
          
          # Create temp directory for conflict analysis
          TEMP_DIR=$(mktemp -d)
          echo "$TEMP_DIR" > /tmp/temp_dir_path.txt
          
          # Detailed analysis for each conflicted file
          for FILE in "${CONFLICT_FILES[@]}"; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📄 FILE: $FILE"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            
            # Extract 3-way merge versions
            git show ":1:$FILE" > "$TEMP_DIR/base_${FILE//\//_}.tmp" 2>/dev/null || echo -n "" > "$TEMP_DIR/base_${FILE//\//_}.tmp"
            git show ":2:$FILE" > "$TEMP_DIR/ours_${FILE//\//_}.tmp" 2>/dev/null || echo -n "" > "$TEMP_DIR/ours_${FILE//\//_}.tmp"
            git show ":3:$FILE" > "$TEMP_DIR/theirs_${FILE//\//_}.tmp" 2>/dev/null || echo -n "" > "$TEMP_DIR/theirs_${FILE//\//_}.tmp"
            
            BASE_LINES=$(wc -l < "$TEMP_DIR/base_${FILE//\//_}.tmp" 2>/dev/null || echo 0)
            OURS_LINES=$(wc -l < "$TEMP_DIR/ours_${FILE//\//_}.tmp" 2>/dev/null || echo 0)
            THEIRS_LINES=$(wc -l < "$TEMP_DIR/theirs_${FILE//\//_}.tmp" 2>/dev/null || echo 0)
            CONFLICT_BLOCKS=$(grep -c "^<<<<<<" "$FILE" 2>/dev/null || echo 0)
            
            echo "📊 File Statistics:"
            echo "   Base (ancestor) : $BASE_LINES lines"
            echo "   Ours (support)  : $OURS_LINES lines"
            echo "   Theirs (develop): $THEIRS_LINES lines"
            echo "   Conflict blocks : $CONFLICT_BLOCKS"
            echo ""
            
            # ── 1. Extract line numbers where conflicts occur ─────────────────
            echo "📍 Conflict Locations (line numbers):"
            grep -n "^<<<<<<" "$FILE" 2>/dev/null | while IFS=: read -r LINE_NUM _; do
              # Find the matching >>>>>> to get range
              END_LINE=$(tail -n +$LINE_NUM "$FILE" | grep -n "^>>>>>>" | head -1 | cut -d: -f1)
              if [ -n "$END_LINE" ]; then
                END_LINE=$((LINE_NUM + END_LINE - 1))
                echo "   Lines $LINE_NUM-$END_LINE"
              else
                echo "   Line $LINE_NUM (end marker not found)"
              fi
            done
            echo ""
            
            # ── 2. Extract function/method names containing conflicts ─────────
            echo "🔍 Functions/Methods with conflicts:"
            # Get line numbers of all conflict markers
            CONFLICT_LINES=$(grep -n "^<<<<<<" "$FILE" 2>/dev/null | cut -d: -f1 || true)
            
            if [ -n "$CONFLICT_LINES" ]; then
              for CONFLICT_LINE in $CONFLICT_LINES; do
                # Search backwards for function/method/class definitions (C++, Python, JS patterns)
                FUNC_NAME=$(head -n $CONFLICT_LINE "$FILE" 2>/dev/null | \
                  grep -E '(^[a-zA-Z_].*\(|^\s*(def|function|class|func|fn|void|int|bool|static|public|private|protected).*\(|::.*\()' | \
                  tail -1 | \
                  sed 's/^[[:space:]]*//' | \
                  sed 's/{.*//' | \
                  cut -c 1-80 || echo "")
                
                if [ -n "$FUNC_NAME" ]; then
                  echo "   • $FUNC_NAME"
                else
                  echo "   • (global scope or undetected)"
                fi
              done
            else
              echo "   (no conflict markers found)"
            fi
            echo ""
            
            # ── 3. Show COMPLETE 3-way conflict details ────────────────────────
            echo "📋 COMPLETE 3-Way Analysis:"
            echo ""
            echo "   ╔═══════════════════════════════════════════════════════════╗"
            echo "   ║  Understanding the conflict:                              ║"
            echo "   ║  ────────────────────────────────────────────────────────║"
            echo "   ║  SOURCE BEFORE = dummy_develop BEFORE your PR (BASE)      ║"
            echo "   ║  SOURCE AFTER  = dummy_develop AFTER your PR (THEIRS)     ║"
            echo "   ║  TARGET        = support/$VERSION current state (OURS)    ║"
            echo "   ║                                                           ║"
            echo "   ║  CHANGE = What your PR modified (BASE → THEIRS)           ║"
            echo "   ╚═══════════════════════════════════════════════════════════╝"
            echo ""
            
            # Extract conflict line numbers
            CONFLICT_LINE_NUMS=$(grep -n "^<<<<<<" "$FILE" 2>/dev/null | cut -d: -f1 || true)
            
            if [ -n "$CONFLICT_LINE_NUMS" ]; then
              CONFLICT_NUM=0
              for START_LINE in $CONFLICT_LINE_NUMS; do
                CONFLICT_NUM=$((CONFLICT_NUM + 1))
                
                # Find separator and end markers
                SEPARATOR_LINE=$(tail -n +$START_LINE "$FILE" | grep -n "^=======" | head -1 | cut -d: -f1)
                END_LINE=$(tail -n +$START_LINE "$FILE" | grep -n "^>>>>>>" | head -1 | cut -d: -f1)
                
                if [ -n "$SEPARATOR_LINE" ] && [ -n "$END_LINE" ]; then
                  SEPARATOR_LINE=$((START_LINE + SEPARATOR_LINE - 1))
                  END_LINE=$((START_LINE + END_LINE - 1))
                  
                  echo "   ╔═ Conflict #$CONFLICT_NUM ═════════════════════════════════════╗"
                  echo "   ║"
                  
                  # 1. Show BASE (Source BEFORE PR)
                  echo "   ║ 1️⃣  SOURCE BEFORE PR (dummy_develop original):"
                  echo "   ║    ─────────────────────────────────────────────────"
                  # Calculate approximate line in BASE file
                  BASE_LINE=$((START_LINE - 10))
                  if [ $BASE_LINE -lt 1 ]; then BASE_LINE=1; fi
                  sed -n "${BASE_LINE},$((BASE_LINE + 20))p" "$TEMP_DIR/base_${FILE//\//_}.tmp" 2>/dev/null | grep -A 2 -B 2 "LOGWARN\|LOGINFO\|LOGERR\|failure\|error" | head -5 | while IFS= read -r line; do
                    echo "   ║    $line"
                  done || echo "   ║    (unable to extract)"
                  
                  echo "   ║"
                  echo "   ║    ⬇️  YOUR PR CHANGED IT TO ⬇️"
                  echo "   ║"
                  
                  # 2. Show THEIRS (Source AFTER PR - the change)
                  echo "   ║ 2️⃣  SOURCE AFTER PR (what merge commit has):"
                  echo "   ║    ─────────────────────────────────────────────────"
                  sed -n "$((SEPARATOR_LINE + 1)),$((END_LINE - 1))p" "$FILE" 2>/dev/null | while IFS= read -r line; do
                    echo "   ║    $line"
                  done
                  
                  echo "   ║"
                  echo "   ║    📊 CHANGE = BASE → THEIRS"
                  echo "   ║"
                  
                  # 3. Show OURS (Target current state)
                  echo "   ║ 3️⃣  TARGET CURRENT STATE (support/$VERSION has):"
                  echo "   ║    ─────────────────────────────────────────────────"
                  sed -n "$((START_LINE + 1)),$((SEPARATOR_LINE - 1))p" "$FILE" 2>/dev/null | while IFS= read -r line; do
                    echo "   ║    $line"
                  done
                  
                  echo "   ║"
                  echo "   ║ 📌 ANALYSIS:"
                  # Check if BASE == OURS
                  BASE_CONTENT=$(sed -n "${BASE_LINE},$((BASE_LINE + 20))p" "$TEMP_DIR/base_${FILE//\//_}.tmp" 2>/dev/null | grep "LOGWARN\|LOGINFO\|LOGERR\|failure" | head -1 || echo "")
                  OURS_CONTENT=$(sed -n "$((START_LINE + 1)),$((SEPARATOR_LINE - 1))p" "$FILE" 2>/dev/null | grep "LOGWARN\|LOGINFO\|LOGERR\|failure" | head -1 || echo "")
                  
                  if [ -n "$BASE_CONTENT" ] && [ -n "$OURS_CONTENT" ]; then
                    if [ "$BASE_CONTENT" = "$OURS_CONTENT" ]; then
                      echo "   ║    ✅ BASE = TARGET (both have same original line)"
                      echo "   ║    → This is a NON-CONFLICT: Just apply the change!"
                    else
                      echo "   ║    ⚠️  BASE ≠ TARGET (different lines)"
                      echo "   ║    → This is a REAL CONFLICT: Both sides changed"
                    fi
                  else
                    echo "   ║    ℹ️  Complex conflict (analyze manually)"
                  fi
                  
                  echo "   ║"
                  echo "   ╚═══════════════════════════════════════════════════════════╝"
                  echo ""
                fi
              done
            fi
            
            echo ""
          done
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
