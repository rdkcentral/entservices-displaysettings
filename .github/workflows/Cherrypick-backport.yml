name: PR - Backport to Release Branch

# yml2: Runs when PR is MERGED into develop/dummy_develop/support/* branches.
# - Reads release_version from PR description (same rule as yml1)
# - none → skip
# - valid → create feature branch on support branch, apply changes, open PR

on:
  pull_request:
    types: [closed]
    branches:
      - dummy_develop
      - 'support/**'
      - 'release/**'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  backport:
    # Only run when the PR was actually merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:

      # ── 0. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RDKCM_RDKE }}

      - name: Configure Git
        run: |
          git config user.name  "GitHub Actions [Backport]"
          git config user.email "github-actions@users.noreply.github.com"

      # ── 1. Extract and validate release_version + ticket ─────────────────────
      - name: Extract PR info and validate release_version
        id: info
        env:
          PR_BODY:     ${{ github.event.pull_request.body }}
          PR_BRANCH:   ${{ github.event.pull_request.head.ref }}
          PR_TITLE:    ${{ github.event.pull_request.title }}
          PR_URL:      ${{ github.event.pull_request.html_url }}
          MERGE_SHA:   ${{ github.event.pull_request.merge_commit_sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          # ── Extract release_version ─────────────────────────────────────────
          VERSION=$(echo "$PR_BODY" \
            | grep -i 'release_version:' \
            | head -1 \
            | sed 's/.*release_version:[[:space:]]*//' \
            | xargs 2>/dev/null || true)

          echo "PR branch       : $PR_BRANCH"
          echo "Merged into     : $BASE_BRANCH"
          echo "release_version : '$VERSION'"

          # ── Field missing ───────────────────────────────────────────────────
          if [ -z "$VERSION" ]; then
            echo "❌ 'release_version:' field missing from PR description."
            echo "   Add: release_version: none  OR  release_version: 8.3.4"
            exit 1
          fi

          # ── none → skip ─────────────────────────────────────────────────────
          if echo "$VERSION" | grep -qi '^none$'; then
            echo "ℹ️  release_version: none — no backport needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Validate format ─────────────────────────────────────────────────
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "❌ Invalid release_version format: '$VERSION'"
            echo "   Use: 8.3.4  or  8.3.4.0"
            exit 1
          fi

          # ── Build support branch name ───────────────────────────────────────
          PARTS=$(echo "$VERSION" | tr '.' ' ' | wc -w | tr -d ' ')
          if [ "$PARTS" -eq 3 ]; then
            SUPPORT_BRANCH="support/${VERSION}.0"
          else
            SUPPORT_BRANCH="support/${VERSION}"
          fi

          # ── Extract ticket number from PR branch (e.g. RDKEMW-21092_aipoc → RDKEMW-21092)
          TICKET=$(echo "$PR_BRANCH" | grep -oE '[A-Z]+-[0-9]+' | head -1 || echo "BACKPORT")

          # ── Feature branch name on the support branch ───────────────────────
          FEATURE_BRANCH="feature/${TICKET}"

          echo "skip=false"                       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"                 >> "$GITHUB_OUTPUT"
          echo "ticket=$TICKET"                   >> "$GITHUB_OUTPUT"
          echo "support_branch=$SUPPORT_BRANCH"   >> "$GITHUB_OUTPUT"
          echo "feature_branch=$FEATURE_BRANCH"   >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA"             >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE"               >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL"                   >> "$GITHUB_OUTPUT"

          echo ""
          echo "┌─ BACKPORT PLAN ────────────────────────────────────────────────┐"
          echo "│  Ticket          : $TICKET"
          echo "│  Release version : $VERSION"
          echo "│  Support branch  : $SUPPORT_BRANCH"
          echo "│  Feature branch  : $FEATURE_BRANCH  (will be created on support)"
          echo "│  Merge commit    : $MERGE_SHA"
          echo "└────────────────────────────────────────────────────────────────┘"

      # ── 2. Validate support branch exists ────────────────────────────────────
      - name: Validate support branch exists
        if: steps.info.outputs.skip != 'true'
        env:
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
        run: |
          git fetch origin 2>/dev/null || true

          if git ls-remote --exit-code --heads origin "$SUPPORT_BRANCH" > /dev/null 2>&1; then
            echo "✅ Support branch exists: $SUPPORT_BRANCH"
          else
            echo "❌ Support branch NOT found: $SUPPORT_BRANCH"
            echo ""
            echo "   Available support branches:"
            git branch -r | grep 'origin/support/' | sed 's/origin\//  /'
            echo ""
            echo "   Check your release_version value in the PR description."
            exit 1
          fi

      # ── 3. Create or checkout feature branch from support ────────────────────
      - name: Create or checkout feature branch
        if: steps.info.outputs.skip != 'true'
        env:
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
        run: |
          git fetch origin "$SUPPORT_BRANCH"

          if git ls-remote --exit-code --heads origin "$FEATURE_BRANCH" > /dev/null 2>&1; then
            echo "Branch '$FEATURE_BRANCH' already exists — checking out..."
            git fetch origin "$FEATURE_BRANCH"
            git checkout "$FEATURE_BRANCH"
            git reset --hard "origin/$FEATURE_BRANCH"
          else
            echo "Creating '$FEATURE_BRANCH' from 'origin/$SUPPORT_BRANCH'..."
            git checkout -b "$FEATURE_BRANCH" "origin/$SUPPORT_BRANCH"
          fi

          echo "✅ On branch: $(git rev-parse --abbrev-ref HEAD)"

      # ── 4. Apply changes via cherry-pick (single operation) ──────────────────
      - name: Apply changes from merge commit
        if: steps.info.outputs.skip != 'true'
        id: apply
        env:
          MERGE_SHA:      ${{ steps.info.outputs.merge_sha }}
          TICKET:         ${{ steps.info.outputs.ticket }}
          VERSION:        ${{ steps.info.outputs.version }}
          PR_TITLE:       ${{ steps.info.outputs.pr_title }}
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
          REPO:           ${{ github.repository }}
          PR_NUMBER:      ${{ github.event.pull_request.number }}
        run: |
          set +e
          echo "Applying: git cherry-pick -m 1 --no-commit $MERGE_SHA"
          git cherry-pick -m 1 --no-commit "$MERGE_SHA" 2>&1
          CP_EXIT=$?

          # ── Always remove .github/ conflicts first (modify/delete on support branch) ──
          # support/x.x.x.x does not have .github/ — any conflict there is expected, remove it
          GITHUB_CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null | grep '^\.github/' || true)
          if [ -n "$GITHUB_CONFLICTS" ]; then
            echo "Removing .github/ conflicts (not needed on release branch):"
            echo "$GITHUB_CONFLICTS" | while read -r f; do
              git rm --cached --force "$f" 2>/dev/null || true
              rm -f "$f" 2>/dev/null || true
              echo "  ⛔ $f (excluded)"
            done
          fi

          # ── Also remove any staged .github/ files (even without conflict) ──
          git restore --staged .github/ 2>/dev/null || true
          git checkout HEAD -- .github/ 2>/dev/null || true

          # ── Check if any REAL (non-.github/) conflicts remain ──
          REAL_CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null | grep -v '^\.github/' || true)

          if [ -z "$REAL_CONFLICTS" ]; then
            # No real conflicts — success
            echo ""
            echo "Files going to release branch:"
            git diff --cached --name-only | while read -r f; do echo "  ✅ $f"; done
            echo ""

            if git diff --cached --quiet; then
              echo "✅ No code changes to apply — already up to date."
              echo "applied=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "${TICKET}: Backport to support/${VERSION} — ${PR_TITLE}"
            echo "✅ Changes applied and committed."
            echo "applied=true"    >> "$GITHUB_OUTPUT"
            echo "conflicts=false" >> "$GITHUB_OUTPUT"

          else
            # ── Real conflict report ──────────────────────────────────────────
            echo "⚠️  MERGE CONFLICTS in code files:"
            echo "$REAL_CONFLICTS" | while read -r f; do echo "    ❌ $f"; done

            # ── Abort the failed cherry-pick cleanly ─────────────────────────
            git cherry-pick --abort 2>/dev/null || true

            # ── Emit conflict outputs for downstream steps ────────────────────
            echo "conflict_files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$REAL_CONFLICTS"     >> "$GITHUB_OUTPUT"
            echo "EOF"                 >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER"   >> "$GITHUB_OUTPUT"
            echo "applied=false"          >> "$GITHUB_OUTPUT"
            echo "conflicts=true"         >> "$GITHUB_OUTPUT"

            # ── Write conflict metadata JSON (uploaded as artifact next step) ─
            mkdir -p /tmp/conflict-metadata
            jq -n \
              --arg fb "$FEATURE_BRANCH" \
              --arg sb "$SUPPORT_BRANCH" \
              --arg ms "$MERGE_SHA" \
              --arg t  "$TICKET" \
              --arg v  "$VERSION" \
              --arg pn "$PR_NUMBER" \
              '{feature_branch:$fb,support_branch:$sb,merge_sha:$ms,ticket:$t,version:$v,pr_number:$pn}' \
              > /tmp/conflict-metadata/data.json

            echo "📋 Conflict files:"
            echo "$REAL_CONFLICTS" | while read -r f; do echo "    ❌ $f"; done
            echo "✅ Conflict metadata written — resolver will auto-trigger."
            exit 1
          fi

      # ── 4b. Upload conflict metadata artifact ────────────────────────────────
      - name: Upload conflict metadata
        if: always() && steps.apply.outputs.conflicts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: conflict-metadata
          path: /tmp/conflict-metadata/data.json
          retention-days: 1

      # ── 4c. Trigger conflict-resolver workflow via dispatch ───────────────────
      - name: Trigger conflict resolver
        if: always() && steps.apply.outputs.conflicts == 'true'
        env:
          GH_TOKEN:       ${{ secrets.RDKCM_RDKE }}
          REPO:           ${{ github.repository }}
          WORKFLOW_REF:   ${{ github.event.pull_request.base.ref }}
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
          MERGE_SHA:      ${{ steps.info.outputs.merge_sha }}
          TICKET:         ${{ steps.info.outputs.ticket }}
          VERSION:        ${{ steps.info.outputs.version }}
          PR_NUMBER:      ${{ github.event.pull_request.number }}
        run: |
          echo "🚀 Triggering conflict-resolver.yml on branch: $WORKFLOW_REF"

          PAYLOAD=$(jq -n \
            --arg ref  "$WORKFLOW_REF" \
            --arg mode "auto" \
            --arg fb   "$FEATURE_BRANCH" \
            --arg sb   "$SUPPORT_BRANCH" \
            --arg ms   "$MERGE_SHA" \
            --arg t    "$TICKET" \
            --arg v    "$VERSION" \
            --arg pn   "$PR_NUMBER" \
            '{
              ref: $ref,
              inputs: {
                mode: $mode,
                feature_branch: $fb,
                support_branch: $sb,
                merge_sha: $ms,
                ticket: $t,
                version: $v,
                pr_number: $pn
              }
            }')

          HTTP=$(curl -s -o /tmp/dispatch_resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/conflict-resolver.yml/dispatches" \
            -d "$PAYLOAD")

          echo "HTTP response: $HTTP"
          cat /tmp/dispatch_resp.json || true

          if [ "$HTTP" = "204" ]; then
            echo "✅ Conflict resolver triggered successfully on ref: $WORKFLOW_REF"
          else
            echo "❌ Dispatch FAILED HTTP $HTTP on ref: $WORKFLOW_REF"
            echo "   Payload sent:"
            echo "$PAYLOAD"
            echo "   Tip: Check that conflict-resolver.yml exists on branch: $WORKFLOW_REF"
            echo "        and that RDKCM_RDKE token has actions:write permission."
            exit 1
          fi

      # ── 5. Create backport tags (BEFORE the push, so tag points to the commit) ─
      - name: Create backport tag
        if: steps.info.outputs.skip != 'true' && steps.apply.outputs.applied == 'true'
        id: tag
        env:
          TICKET:  ${{ steps.info.outputs.ticket }}
          VERSION: ${{ steps.info.outputs.version }}
          REPO:    ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u '+%Y%m%d%H%M')

          # Tag format: backport/{ticket}/{version}/{timestamp}
          # e.g.  backport/RDKEMW-21092/8.3.4/202608031045
          BACKPORT_TAG="backport/${TICKET}/${VERSION}/${TIMESTAMP}"

          git tag "$BACKPORT_TAG"
          git push origin "$BACKPORT_TAG"

          echo "backport_tag=$BACKPORT_TAG" >> "$GITHUB_OUTPUT"
          echo "✅ Backport tag created: $BACKPORT_TAG"

      # ── 6. Push feature branch ───────────────────────────────────────────────
      - name: Push feature branch
        if: steps.info.outputs.skip != 'true' && steps.apply.outputs.applied == 'true'
        env:
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
        run: |
          git push origin "$FEATURE_BRANCH"
          echo "✅ Pushed: $FEATURE_BRANCH"

      # ── 7. Create Pull Request ───────────────────────────────────────────────
      - name: Create Pull Request to support branch
        if: steps.info.outputs.skip != 'true' && steps.apply.outputs.applied == 'true'
        env:
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
          TICKET:         ${{ steps.info.outputs.ticket }}
          VERSION:        ${{ steps.info.outputs.version }}
          PR_TITLE:       ${{ steps.info.outputs.pr_title }}
          ORIGINAL_PR:    ${{ steps.info.outputs.pr_url }}
          BACKPORT_TAG:   ${{ steps.tag.outputs.backport_tag }}
          REPO:           ${{ github.repository }}
          GH_TOKEN:       ${{ secrets.RDKCM_RDKE }}
        run: |
          set +e
          TITLE="${TICKET}: Backport into support/${VERSION}"
          BODY="${TICKET}: Backport of **${PR_TITLE}** into \`${SUPPORT_BRANCH}\`."$'\n\n'"---"$'\n'"**Ticket:** ${TICKET}"$'\n'"**Original PR:** ${ORIGINAL_PR}"$'\n'"**Backport tag:** ${BACKPORT_TAG}"$'\n\n'"release_version: none"

          JSON=$(jq -n \
            --arg title "$TITLE" \
            --arg body  "$BODY" \
            --arg head  "$FEATURE_BRANCH" \
            --arg base  "$SUPPORT_BRANCH" \
            '{title: $title, body: $body, head: $head, base: $base}')

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -d "$JSON")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY_RESP=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "201" ]; then
            PR_URL=$(echo "$BODY_RESP" | jq -r '.html_url')
            echo "✅ PR created: $PR_URL"
          elif [ "$HTTP_CODE" = "422" ]; then
            ERROR_MSG=$(echo "$BODY_RESP" | jq -r '.errors[0].message // .message // "unknown"')
            if echo "$ERROR_MSG" | grep -qi "already exists"; then
              echo "✅ PR already exists — branch updated automatically."
            else
              echo "⚠️  PR error: $ERROR_MSG"
            fi
          else
            echo "⚠️  HTTP $HTTP_CODE — create PR manually."
          fi
