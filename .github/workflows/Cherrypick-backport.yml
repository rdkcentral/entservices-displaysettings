name: PR - Backport to Release Branch

# Runs when a PR is MERGED into dummy_develop / support/** / release/**
# Reads release_version from PR description:
#   release_version: none     → skip
#   release_version: 8.3.4.0  → backport to support/8.3.4.0
#
# If cherry-pick has conflicts → resolves them inline (diff3 / take incoming)
# No second workflow needed. No workflow_run dependency. Self-contained.

on:
  pull_request:
    types: [closed]
    branches:
      - dummy_develop
      - 'support/**'
      - 'release/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:

      # ── 0. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RDKCM_RDKE }}

      - name: Configure Git
        run: |
          git config user.name  "GitHub Actions [Backport]"
          git config user.email "github-actions@users.noreply.github.com"

      # ── 1. Extract and validate release_version + ticket ─────────────────────
      - name: Extract PR info and validate release_version
        id: info
        env:
          PR_BODY:     ${{ github.event.pull_request.body }}
          PR_BRANCH:   ${{ github.event.pull_request.head.ref }}
          PR_TITLE:    ${{ github.event.pull_request.title }}
          PR_URL:      ${{ github.event.pull_request.html_url }}
          MERGE_SHA:   ${{ github.event.pull_request.merge_commit_sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          
          echo "PR branch       : $PR_BRANCH"
          echo "Merged into     : $BASE_BRANCH"
          echo "Merge SHA       : $MERGE_SHA"
          
          # ── Validate merge_commit_sha ─────────────────────────────────────
          if [ -z "$MERGE_SHA" ]; then
            echo "❌ FATAL: merge_commit_sha is empty"
            echo "   Cannot perform cherry-pick without merge commit SHA"
            exit 1
          fi
          
          # ── Extract release_version (same logic as pr-validate-release.yml) ──
          # Handle case insensitive, flexible colon spacing, trailing comments, multi-line YAML
          RAW_LINE=$(echo "$PR_BODY" | grep -iE '^\s*release[_-]?version\s*:' | head -1 || true)
          
          if [ -z "$RAW_LINE" ]; then
            echo "❌ 'release_version:' field missing from PR description"
            echo "   Add: release_version: none  OR  release_version: 8.3.4.0"
            exit 1
          fi
          
          # Extract value (handle value on same line or next line)
          VALUE_ON_SAME_LINE=$(echo "$RAW_LINE" | sed -E 's/^[^:]*:\s*//' | sed 's/#.*//' | xargs || true)
          
          if [ -z "$VALUE_ON_SAME_LINE" ]; then
            # Multi-line YAML: check next non-empty line
            LINE_NUM=$(echo "$PR_BODY" | grep -inE '^\s*release[_-]?version\s*:' | head -1 | cut -d: -f1)
            VALUE_ON_SAME_LINE=$(echo "$PR_BODY" | tail -n +$((LINE_NUM + 1)) | grep -v '^[[:space:]]*$' | head -1 | sed 's/#.*//' | xargs || true)
          fi
          
          VERSION=$(echo "$VALUE_ON_SAME_LINE" | sed 's/#.*//' | tr -d '\n\r' | xargs || true)
          
          echo "release_version : '$VERSION'"
          
          # ── Validate: Field must have value ───────────────────────────────
          if [ -z "$VERSION" ]; then
            echo "❌ release_version field is empty"
            exit 1
          fi
          
          # ── Validate: Handle 'none' (no backport) ─────────────────────────
          if echo "$VERSION" | grep -qiE '^none$'; then
            echo "ℹ️  release_version: none — no backport needed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # ── Validate: Format (X.Y.Z or X.Y.Z.W) ───────────────────────────
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "❌ Invalid release_version format: '$VERSION'"
            echo "   Valid: 8.3.4  or  8.3.4.0"
            exit 1
          fi
          
          # ── Validate: No leading zeros ────────────────────────────────────
          IFS='.' read -ra PARTS <<< "$VERSION"
          for PART in "${PARTS[@]}"; do
            if [[ "$PART" =~ ^0[0-9]+ ]]; then
              echo "❌ Invalid: version part has leading zero: '$PART'"
              echo "   Wrong: 08.03.04.00"
              echo "   Valid: 8.3.4.0"
              exit 1
            fi
          done
          
          # ── Validate: Reasonable ranges (0-999) ───────────────────────────
          for PART in "${PARTS[@]}"; do
            if [ "$PART" -gt 999 ]; then
              echo "❌ Invalid: version part too large: $PART (max: 999)"
              exit 1
            fi
          done
          
          # ── Build support branch name ──────────────────────────────────────
          PART_COUNT=${#PARTS[@]}
          if [ "$PART_COUNT" -eq 3 ]; then
            SUPPORT_BRANCH="support/${VERSION}.0"
          else
            SUPPORT_BRANCH="support/${VERSION}"
          fi
          
          # ── Extract and validate ticket ────────────────────────────────────
          TICKET=$(echo "$PR_BRANCH" | grep -oE '[A-Z]+-[0-9]+' | head -1 || true)
          
          if [ -z "$TICKET" ]; then
            echo "⚠️  No ticket found in branch name '$PR_BRANCH'"
            echo "   Using fallback: BACKPORT"
            TICKET="BACKPORT"
          else
            echo "✅ Ticket extracted: $TICKET"
          fi
          
          FEATURE_BRANCH="feature/${TICKET}"
          
          # ── Set outputs ────────────────────────────────────────────────────
          echo "skip=false"                       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"                 >> "$GITHUB_OUTPUT"
          echo "ticket=$TICKET"                   >> "$GITHUB_OUTPUT"
          echo "support_branch=$SUPPORT_BRANCH"   >> "$GITHUB_OUTPUT"
          echo "feature_branch=$FEATURE_BRANCH"   >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA"             >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE"               >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL"                   >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          
          echo ""
          echo "┌─ BACKPORT PLAN ────────────────────────────────────────────────┐"
          echo "│  Ticket          : $TICKET"
          echo "│  Release version : $VERSION"
          echo "│  Support branch  : $SUPPORT_BRANCH"
          echo "│  Feature branch  : $FEATURE_BRANCH"
          echo "│  Merge commit    : $MERGE_SHA"
          echo "└────────────────────────────────────────────────────────────────┘"

      # ── 2. Validate support branch exists ────────────────────────────────────
      - name: Validate support branch exists
        if: steps.info.outputs.skip != 'true'
        env:
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
        run: |
          set -euo pipefail
          
          if [ -z "$SUPPORT_BRANCH" ]; then
            echo "❌ FATAL: SUPPORT_BRANCH is empty"
            exit 1
          fi
          
          if git ls-remote --exit-code --heads origin "$SUPPORT_BRANCH" > /dev/null 2>&1; then
            echo "✅ Support branch exists: $SUPPORT_BRANCH"
          else
            echo "❌ Support branch NOT found: $SUPPORT_BRANCH"
            echo ""
            echo "Available support branches:"
            git ls-remote --heads origin 'refs/heads/support/*' | sed 's|.*refs/heads/||' | sed 's/^/  /'
            exit 1
          fi

      # ── 3. Create or checkout feature branch from support ────────────────────
      - name: Create or checkout feature branch
        if: steps.info.outputs.skip != 'true'
        env:
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
        run: |
          set -euo pipefail
          
          if [ -z "$SUPPORT_BRANCH" ]; then
            echo "❌ FATAL: SUPPORT_BRANCH is empty"
            exit 1
          fi
          
          if [ -z "$FEATURE_BRANCH" ]; then
            echo "❌ FATAL: FEATURE_BRANCH is empty"
            exit 1
          fi
          
          git fetch origin "$SUPPORT_BRANCH"
          
          # CUMULATIVE COMMITS: Preserve existing backport commits
          if git ls-remote --exit-code --heads origin "$FEATURE_BRANCH" > /dev/null 2>&1; then
            echo "Feature branch '$FEATURE_BRANCH' already exists"
            echo "Checking out and pulling latest commits (APPEND mode - preserves history)..."
            git fetch origin "$FEATURE_BRANCH"
            git checkout "$FEATURE_BRANCH"
            git pull origin "$FEATURE_BRANCH"
            
            # Verify we're on the right base
            MERGE_BASE=$(git merge-base HEAD "origin/$SUPPORT_BRANCH")
            SUPPORT_SHA=$(git rev-parse "origin/$SUPPORT_BRANCH")
            
            if [ "$MERGE_BASE" != "$SUPPORT_SHA" ]; then
              echo "⚠️  WARNING: Feature branch has diverged from support branch"
              echo "   Merge base: $MERGE_BASE"
              echo "   Support:    $SUPPORT_SHA"
              echo "   This may cause issues. Consider manual rebase if needed."
            fi
          else
            echo "Creating new feature branch '$FEATURE_BRANCH' from '$SUPPORT_BRANCH'..."
            git checkout -b "$FEATURE_BRANCH" "origin/$SUPPORT_BRANCH"
          fi
          
          # Verify checkout succeeded
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CURRENT_BRANCH" != "$FEATURE_BRANCH" ]; then
            echo "❌ FATAL: Checkout failed"
            echo "   Expected: $FEATURE_BRANCH"
            echo "   Got: $CURRENT_BRANCH"
            exit 1
          fi
          
          echo "✅ On branch: $CURRENT_BRANCH"

      # ══════════════════════════════════════════════════════════════════════════
      # 4. APPLY CHANGES (4 PHASES)
      # ══════════════════════════════════════════════════════════════════════════

