name: PR - Backport to Release Branch

# Runs when a PR is MERGED into dummy_develop / support/** / release/**
# Reads release_version from PR description:
#   release_version: none     → skip
#   release_version: 8.3.4.0  → backport to support/8.3.4.0
#
# If cherry-pick has conflicts → resolves them inline (diff3 / take incoming)
# No second workflow needed. No workflow_run dependency. Self-contained.

on:
  pull_request:
    types: [closed]
    branches:
      - dummy_develop
      - 'support/**'
      - 'release/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:

      # ── 0. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RDKCM_RDKE }}

      - name: Configure Git
        run: |
          git config user.name  "GitHub Actions [Backport]"
          git config user.email "github-actions@users.noreply.github.com"

      # ── 1. Extract and validate release_version + ticket ─────────────────────
      - name: Extract PR info and validate release_version
        id: info
        env:
          PR_BODY:     ${{ github.event.pull_request.body }}
          PR_BRANCH:   ${{ github.event.pull_request.head.ref }}
          PR_TITLE:    ${{ github.event.pull_request.title }}
          PR_URL:      ${{ github.event.pull_request.html_url }}
          MERGE_SHA:   ${{ github.event.pull_request.merge_commit_sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          VERSION=$(echo "$PR_BODY" \
            | grep -i 'release_version:' \
            | head -1 \
            | sed 's/.*release_version:[[:space:]]*//' \
            | xargs 2>/dev/null || true)

          echo "PR branch       : $PR_BRANCH"
          echo "Merged into     : $BASE_BRANCH"
          echo "release_version : '$VERSION'"

          if [ -z "$VERSION" ]; then
            echo "❌ 'release_version:' field missing from PR description."
            echo "   Add: release_version: none  OR  release_version: 8.3.4.0"
            exit 1
          fi

          if echo "$VERSION" | grep -qi '^none$'; then
            echo "ℹ️  release_version: none — no backport needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "❌ Invalid release_version format: '$VERSION'"
            echo "   Use: 8.3.4  or  8.3.4.0"
            exit 1
          fi

          PARTS=$(echo "$VERSION" | tr '.' ' ' | wc -w | tr -d ' ')
          if [ "$PARTS" -eq 3 ]; then
            SUPPORT_BRANCH="support/${VERSION}.0"
          else
            SUPPORT_BRANCH="support/${VERSION}"
          fi

          TICKET=$(echo "$PR_BRANCH" | grep -oE '[A-Z]+-[0-9]+' | head -1 || echo "BACKPORT")
          FEATURE_BRANCH="feature/${TICKET}"

          echo "skip=false"                       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"                 >> "$GITHUB_OUTPUT"
          echo "ticket=$TICKET"                   >> "$GITHUB_OUTPUT"
          echo "support_branch=$SUPPORT_BRANCH"   >> "$GITHUB_OUTPUT"
          echo "feature_branch=$FEATURE_BRANCH"   >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA"             >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE"               >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL"                   >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "┌─ BACKPORT PLAN ────────────────────────────────────────────────┐"
          echo "│  Ticket          : $TICKET"
          echo "│  Release version : $VERSION"
          echo "│  Support branch  : $SUPPORT_BRANCH"
          echo "│  Feature branch  : $FEATURE_BRANCH"
          echo "│  Merge commit    : $MERGE_SHA"
          echo "└────────────────────────────────────────────────────────────────┘"

      # ── 2. Validate support branch exists ────────────────────────────────────
      - name: Validate support branch exists
        if: steps.info.outputs.skip != 'true'
        env:
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
        run: |
          git fetch origin 2>/dev/null || true

          if git ls-remote --exit-code --heads origin "$SUPPORT_BRANCH" > /dev/null 2>&1; then
            echo "✅ Support branch exists: $SUPPORT_BRANCH"
          else
            echo "❌ Support branch NOT found: $SUPPORT_BRANCH"
            echo "   Available support branches:"
            git branch -r | grep 'origin/support/' | sed 's/origin\//  /'
            exit 1
          fi

      # ── 3. Create or checkout feature branch from support ────────────────────
      - name: Create or checkout feature branch
        if: steps.info.outputs.skip != 'true'
        env:
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
        run: |
          git fetch origin "$SUPPORT_BRANCH"

          # ALWAYS start fresh from support branch (no accumulated commits)
          if git ls-remote --exit-code --heads origin "$FEATURE_BRANCH" > /dev/null 2>&1; then
            echo "Branch '$FEATURE_BRANCH' exists — resetting to clean support base..."
            git fetch origin "$FEATURE_BRANCH"
            git checkout -B "$FEATURE_BRANCH" "origin/$SUPPORT_BRANCH"
          else
            echo "Creating '$FEATURE_BRANCH' from 'origin/$SUPPORT_BRANCH'..."
            git checkout -b "$FEATURE_BRANCH" "origin/$SUPPORT_BRANCH"
          fi

          echo "✅ On branch: $(git rev-parse --abbrev-ref HEAD)"

      # ── 4. Cherry-pick + inline conflict resolution ───────────────────────────
      - name: Apply changes (cherry-pick + auto-resolve conflicts)
        if: steps.info.outputs.skip != 'true'
        id: apply
        env:
          MERGE_SHA:      ${{ steps.info.outputs.merge_sha }}
          TICKET:         ${{ steps.info.outputs.ticket }}
          VERSION:        ${{ steps.info.outputs.version }}
          PR_TITLE:       ${{ steps.info.outputs.pr_title }}
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
          SUPPORT_BRANCH: ${{ steps.info.outputs.support_branch }}
          PR_NUMBER:      ${{ steps.info.outputs.pr_number }}
        run: |
          set +e

          echo "▶ Cherry-picking merge commit: $MERGE_SHA"
          git cherry-pick -m 1 --no-commit "$MERGE_SHA" 2>&1
          CP_EXIT=$?

          # ── Step A: Remove .github/ conflicts (always excluded from release branch) ──
          GITHUB_CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null | grep '^\.github/' || true)
          if [ -n "$GITHUB_CONFLICTS" ]; then
            echo "Removing .github/ conflicts (not needed on release branch):"
            echo "$GITHUB_CONFLICTS" | while read -r f; do
              git rm --cached --force "$f" 2>/dev/null || true
              rm -f "$f" 2>/dev/null || true
              echo "  ⛔ $f (excluded)"
            done
          fi
          git restore --staged .github/ 2>/dev/null || true
          git checkout HEAD -- .github/ 2>/dev/null || true

          # ── Step B: Check for real code conflicts ─────────────────────────────
          REAL_CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null | grep -v '^\.github/' || true)

          if [ -z "$REAL_CONFLICTS" ]; then
            # ── No conflicts — clean cherry-pick ─────────────────────────────
            echo ""
            echo "Files going to release branch:"
            git diff --cached --name-only | while read -r f; do echo "  ✅ $f"; done

            if git diff --cached --quiet; then
              echo "✅ No code changes to apply — already up to date."
              echo "applied=true"        >> "$GITHUB_OUTPUT"
              echo "conflicts=false"     >> "$GITHUB_OUTPUT"
              echo "conflict_resolved=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "${TICKET}: Backport to support/${VERSION} — ${PR_TITLE}"
            echo "✅ Changes applied and committed (no conflicts)."
            echo "applied=true"        >> "$GITHUB_OUTPUT"
            echo "conflicts=false"     >> "$GITHUB_OUTPUT"
            echo "conflict_resolved=false" >> "$GITHUB_OUTPUT"

          else
            # ── Conflicts found — show details + resolve inline ───────────────
            CONFLICT_COUNT=$(echo "$REAL_CONFLICTS" | wc -l | tr -d ' ')
            echo ""
            echo "╔══════════════════════════════════════════════════════════════════╗"
            echo "║           ⚠️  MERGE CONFLICTS DETECTED                          ║"
            echo "╠══════════════════════════════════════════════════════════════════╣"
            echo "║  Ticket         : $TICKET"
            echo "║  Merge SHA      : $MERGE_SHA"
            echo "║  Feature branch : $FEATURE_BRANCH"
            echo "║  Support branch : $SUPPORT_BRANCH"
            echo "║  Total conflicts: $CONFLICT_COUNT file(s)"
            echo "╚══════════════════════════════════════════════════════════════════╝"
            echo ""
            echo "Conflicted files:"
            echo "$REAL_CONFLICTS" | while read -r f; do echo "    ❌ $f"; done
            echo ""

            # Collect into array (avoid subshell from pipe)
            mapfile -t CONFLICT_FILES < <(echo "$REAL_CONFLICTS")

            FAILED_FILES=()

            for FILE in "${CONFLICT_FILES[@]}"; do
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "📄 FILE: $FILE"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

              # Extract all 3 versions
              git show ":1:$FILE" 2>/dev/null > /tmp/base.tmp   || true
              git show ":2:$FILE" 2>/dev/null > /tmp/ours.tmp   || true
              git show ":3:$FILE" 2>/dev/null > /tmp/theirs.tmp || true

              BASE_LINES=$(wc -l < /tmp/base.tmp 2>/dev/null || echo 0)
              OURS_LINES=$(wc -l < /tmp/ours.tmp 2>/dev/null || echo 0)
              THEIRS_LINES=$(wc -l < /tmp/theirs.tmp 2>/dev/null || echo 0)

              echo ""
              echo "  📊 File sizes:"
              echo "     BASE   (common ancestor) : $BASE_LINES lines"
              echo "     OURS   (support branch)  : $OURS_LINES lines"
              echo "     THEIRS (develop/incoming): $THEIRS_LINES lines"
              echo ""

              # Show exactly what lines differ between ours and theirs
              echo "  🔍 DIFF — support branch vs develop (what changed):"
              echo "  ┌─────────────────────────────────────────────────┐"
              diff --unified=5 /tmp/ours.tmp /tmp/theirs.tmp 2>/dev/null \
                | head -80 \
                | sed 's/^/  │ /'
              echo "  └─────────────────────────────────────────────────┘"
              echo ""

              # Show the raw conflict markers in the file
              CONFLICT_SECTIONS=$(grep -n "^<<<<<<\|^======\|^>>>>>>" "$FILE" 2>/dev/null || true)
              if [ -n "$CONFLICT_SECTIONS" ]; then
                CONFLICT_BLOCK_COUNT=$(grep -c "^<<<<<<" "$FILE" 2>/dev/null || echo 0)
                echo "  ⚡ Conflict blocks in file: $CONFLICT_BLOCK_COUNT"
                echo "  ⚡ Conflict marker lines:"
                echo "$CONFLICT_SECTIONS" | sed 's/^/     /'
                echo ""
                echo "  📋 Full conflict sections (with context):"
                echo "  ┌─────────────────────────────────────────────────┐"
                grep -n -A 20 "^<<<<<<" "$FILE" 2>/dev/null \
                  | head -100 \
                  | sed 's/^/  │ /'
                echo "  └─────────────────────────────────────────────────┘"
                echo ""
              fi

              echo "  🔧 Attempting auto-resolution..."

              # ── Strategy 1: clean 3-way merge (diff3) ──────────────────────
              if diff3 -m /tmp/ours.tmp /tmp/base.tmp /tmp/theirs.tmp > /tmp/merged.tmp 2>/dev/null; then
                cp /tmp/merged.tmp "$FILE"
                git add "$FILE"
                MERGED_LINES=$(wc -l < /tmp/merged.tmp 2>/dev/null || echo 0)
                echo "  ✅ Strategy 1: CLEAN 3-WAY MERGE (diff3)"
                echo "     Result: $MERGED_LINES lines — both changes merged intelligently"

              # ── Strategy 2: apply ONLY the cherry-pick delta to support version ──
              # Computes what changed between BASE→THEIRS and patches OURS with it.
              # Support branch file stays intact — only the specific commit lines are applied.
              elif [ -s /tmp/theirs.tmp ]; then
                # Compute the exact delta this cherry-pick commit introduced
                git diff ":1:$FILE" ":3:$FILE" > /tmp/cherry_patch.diff 2>/dev/null || true

                STRATEGY_USED=""
                if [ -s /tmp/cherry_patch.diff ]; then
                  # Start from support branch version (no conflict markers)
                  cp /tmp/ours.tmp "$FILE"

                  # Apply only the delta with fuzzy context tolerance
                  patch --no-backup-if-mismatch -F 5 "$FILE" < /tmp/cherry_patch.diff > /tmp/patch_out.txt 2>&1
                  PATCH_EXIT=$?

                  if [ $PATCH_EXIT -eq 0 ] && [ ! -f "${FILE}.rej" ]; then
                    git add "$FILE"
                    PATCHED_LINES=$(wc -l < "$FILE" 2>/dev/null || echo 0)
                    DELTA_LINES=$(grep -c '^[+-]' /tmp/cherry_patch.diff 2>/dev/null || echo 0)
                    STRATEGY_USED="patch"
                    echo "  ✅ Strategy 2: TARGETED PATCH — only cherry-pick delta applied"
                    echo "     Support file preserved : $OURS_LINES lines kept as base"
                    echo "     Cherry-pick delta      : ~${DELTA_LINES} changed lines applied"
                    echo "     Result file size       : $PATCHED_LINES lines"
                    echo ""
                    echo "  📋 Lines changed by this cherry-pick:"
                    echo "  ┌─────────────────────────────────────────────────┐"
                    grep '^[+-]' /tmp/cherry_patch.diff \
                      | grep -v '^[+-][+-][+-]' \
                      | head -40 \
                      | sed 's/^/  │ /'
                    echo "  └─────────────────────────────────────────────────┘"
                  else
                    echo "  ❌ Strategy 2: PATCH FAILED — cannot apply changes"
                    echo "     Patch exit code: $PATCH_EXIT"
                    cat /tmp/patch_out.txt | sed 's/^/     /'
                    FAILED_FILES+=("$FILE")
                  fi
                  rm -f "${FILE}.rej" "${FILE}.orig" 2>/dev/null || true
                else
                  echo "  ❌ No valid patch could be generated"
                  FAILED_FILES+=("$FILE")
                fi

              else
                echo "  ❌ Strategy: FAILED — could not auto-resolve"
                echo "     Reason: no valid incoming version found"
                FAILED_FILES+=("$FILE")
              fi
              echo ""
            done

            # ── Check if all resolved ─────────────────────────────────────────
            STILL_CONFLICTED=$(git diff --name-only --diff-filter=U 2>/dev/null | grep -v '^\.github/' || true)

            if [ -z "$STILL_CONFLICTED" ] && [ "${#FAILED_FILES[@]}" -eq 0 ]; then
              git commit -m "${TICKET}: Backport to support/${VERSION} — ${PR_TITLE} [conflicts auto-resolved]"
              echo ""
              echo "╔══════════════════════════════════════════════════════════════════╗"
              echo "║  ✅ ALL CONFLICTS RESOLVED SUCCESSFULLY                         ║"
              echo "╠══════════════════════════════════════════════════════════════════╣"
              echo "║  Files resolved : $CONFLICT_COUNT"
              echo "║  Committed to   : $FEATURE_BRANCH"
              echo "║  Next step      : Pushing branch + creating PR..."
              echo "╚══════════════════════════════════════════════════════════════════╝"
              echo "applied=true"           >> "$GITHUB_OUTPUT"
              echo "conflicts=true"         >> "$GITHUB_OUTPUT"
              echo "conflict_resolved=true" >> "$GITHUB_OUTPUT"

            else
              echo ""
              echo "╔══════════════════════════════════════════════════════════════════╗"
              echo "║  ❌ COULD NOT AUTO-RESOLVE — MANUAL FIX REQUIRED                ║"
              echo "╠══════════════════════════════════════════════════════════════════╣"
              for f in "${FAILED_FILES[@]}"; do echo "║    ❌ $f"; done
              echo "╠══════════════════════════════════════════════════════════════════╣"
              echo "║  Run these commands locally to fix:                             ║"
              echo "║                                                                 ║"
              echo "║  git fetch origin                                               ║"
              echo "║  git checkout $FEATURE_BRANCH"
              echo "║  git cherry-pick -m 1 $MERGE_SHA"
              echo "║  # open conflicted files and resolve manually                  ║"
              echo "║  git add .                                                      ║"
              echo "║  git cherry-pick --continue                                     ║"
              echo "║  git push origin $FEATURE_BRANCH"
              echo "╚══════════════════════════════════════════════════════════════════╝"
              echo "applied=false"           >> "$GITHUB_OUTPUT"
              echo "conflicts=true"          >> "$GITHUB_OUTPUT"
              echo "conflict_resolved=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

      # ── 5. Push feature branch ───────────────────────────────────────────────
      - name: Push feature branch
        if: steps.info.outputs.skip != 'true' && steps.apply.outputs.applied == 'true'
        env:
          FEATURE_BRANCH: ${{ steps.info.outputs.feature_branch }}
        run: |
          git push origin "$FEATURE_BRANCH" --force
          echo "✅ Pushed: $FEATURE_BRANCH (clean backport)"

      # ── 6. Create PR only if one does not already exist ──────────────────────
      - name: Create Pull Request (if not already open)
        if: steps.info.outputs.skip != 'true' && steps.apply.outputs.applied == 'true'
        env:
          FEATURE_BRANCH:    ${{ steps.info.outputs.feature_branch }}
          SUPPORT_BRANCH:    ${{ steps.info.outputs.support_branch }}
          TICKET:            ${{ steps.info.outputs.ticket }}
          VERSION:           ${{ steps.info.outputs.version }}
          PR_TITLE:          ${{ steps.info.outputs.pr_title }}
          ORIGINAL_PR:       ${{ steps.info.outputs.pr_url }}
          CONFLICT_RESOLVED: ${{ steps.apply.outputs.conflict_resolved }}
          REPO:              ${{ github.repository }}
          GH_TOKEN:          ${{ secrets.RDKCM_RDKE }}
        run: |
          set +e
          REPO_OWNER=$(echo "$REPO" | cut -d'/' -f1)

          # ── Check if an open PR already exists for this head→base ─────────
          EXISTING=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?head=${REPO_OWNER}:${FEATURE_BRANCH}&base=${SUPPORT_BRANCH}&state=open" \
            | jq -r '.[0].html_url // empty')

          if [ -n "$EXISTING" ]; then
            echo "ℹ️  PR already exists — no new PR needed."
            echo "   Existing PR: $EXISTING"
            exit 0
          fi

          # ── No open PR → create one ────────────────────────────────────────
          echo "✅ No existing PR found — creating backport PR..."

          if [ "$CONFLICT_RESOLVED" = "true" ]; then
            TITLE="${TICKET}: Backport into support/${VERSION} [conflicts auto-resolved]"
            BODY="${TICKET}: Backport of **${PR_TITLE}** into \`${SUPPORT_BRANCH}\`."$'\n\n'
            BODY+="⚠️ **Merge conflicts were auto-resolved** — please review the diff carefully before merging."$'\n\n'
          else
            TITLE="${TICKET}: Backport into support/${VERSION}"
            BODY="${TICKET}: Backport of **${PR_TITLE}** into \`${SUPPORT_BRANCH}\`."$'\n\n'
          fi

          BODY+="---"$'\n'
          BODY+="**Ticket:** ${TICKET}"$'\n'
          BODY+="**Original PR:** ${ORIGINAL_PR}"$'\n\n'
          BODY+="release_version: none"

          JSON=$(jq -n \
            --arg title "$TITLE" \
            --arg body  "$BODY" \
            --arg head  "$FEATURE_BRANCH" \
            --arg base  "$SUPPORT_BRANCH" \
            '{title: $title, body: $body, head: $head, base: $base}')

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -d "$JSON")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY_RESP=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "201" ]; then
            PR_URL=$(echo "$BODY_RESP" | jq -r '.html_url')
            echo "✅ Backport PR created: $PR_URL"
          else
            echo "⚠️  PR creation returned HTTP $HTTP_CODE"
            echo "$BODY_RESP" | jq . || echo "$BODY_RESP"
          fi
